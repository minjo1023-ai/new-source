            ` : `<div class="mt-4 p-3 rounded-xl bg-[#dcfce7] border-2 border-[#3a261f] text-sm font-black text-[#065f46]">🎉 완벽합니다! 단 하나의 오답도 없이 모두 맞혔어요!</div>`}

            <div class="mt-6 flex flex-wrap justify-center gap-3">
              <button onclick="retryStage1All()" class="btn-cozy px-5 py-3 rounded-2xl bg-white font-black text-sm">🔄 STAGE 1 다시 도전</button>
              <button onclick="completeStageAndShowRank('stage1', 'stage2')" class="btn-cozy px-7 py-3 rounded-2xl bg-[#52c498] font-game text-xl">🏆 중간 랭킹 보고 다음으로 →</button>
            </div>
          </div>
        `;
        return;
      }

      const fb = state.s1.lastFeedback;
      root.innerHTML = `
        ${renderPurposeBanner('stage1')}
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch animate-pop">
          <div class="lg:col-span-6 canvas-wrap h-[280px] sm:h-[380px]">
            <div id="canvas-s1" class="w-full h-full"></div>
            <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/90 border-2 border-[#3a261f] text-xs font-black">
              진행: ${state.s1.index + 1} / ${total}
            </div>
            <div class="absolute top-3 right-3 px-3 py-1 rounded-full bg-[#fef3c7] border-2 border-[#3a261f] text-xs font-black">
              ⏱️ <span id="s1-timer-text">${limit > 0 ? limit + '초' : '무제한'}</span>
            </div>
          </div>

          <div class="lg:col-span-6 cozy-card p-6 bg-[#fffdf7] flex flex-col justify-between">
            <div class="text-center">
              <span class="px-3 py-1 rounded-full bg-[#e0f2fe] border-2 border-[#3a261f] text-xs font-black">컨베이어 벨트 위 생활자원</span>
              <div class="text-7xl my-4 animate-float">${card.icon}</div>
              <h2 class="font-game text-3xl sm:text-4xl text-[#3a261f]">${card.name}</h2>
              <p class="text-xs sm:text-sm font-bold text-[#6b4f45] mt-2">이 자원은 어떤 종류의 생활자원일까요?</p>
            </div>

            ${fb ? `
              <div class="mt-5 p-4 rounded-2xl border-2 border-[#3a261f] ${fb.ok ? 'bg-[#dcfce7]' : 'bg-[#fee2e2]'} animate-pop">
                <div class="font-game text-xl ${fb.ok ? 'text-[#065f46]' : 'text-[#991b1b]'}">${fb.title}</div>
                <p class="text-xs sm:text-sm font-bold text-[#3a261f] mt-1">${card.desc}</p>
                <div class="flex flex-wrap gap-2 mt-4">
                  ${!fb.ok ? `<button onclick="retryStage1Card()" class="btn-cozy flex-1 py-2.5 rounded-xl bg-white font-black text-sm">🔄 다시 선택하기</button>` : ''}
                  <button onclick="nextStage1Card()" class="btn-cozy flex-1 py-2.5 rounded-xl bg-[#ffd166] font-game text-lg">다음 카드 →</button>
                </div>
              </div>
            ` : `
              <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="answerStage1('human')" class="btn-cozy py-5 rounded-2xl bg-[#dbeafe] hover:bg-[#bfdbfe] text-center">
                  <div class="text-3xl mb-1">🧠</div>
                  <div class="font-game text-2xl text-[#1e40af]">인적자원</div>
                  <div class="text-[11px] font-bold text-[#1e3a8a] mt-0.5">능력·시간·체력·지식</div>
                </button>
                <button onclick="answerStage1('material')" class="btn-cozy py-5 rounded-2xl bg-[#fef3c7] hover:bg-[#fde68a] text-center">
                  <div class="text-3xl mb-1">📦</div>
                  <div class="font-game text-2xl text-[#92400e]">물적자원</div>
                  <div class="text-[11px] font-bold text-[#78350f] mt-0.5">돈·물건·시설·에너지</div>
                </button>
              </div>
            `}
          </div>
        </div>
      `;
      mount3DScene('canvas-s1', buildStage1Factory3D);
      startS1Timer();
    }

    function answerStage1(choice) {
      clearTimers();
      const card = state.s1.deck[state.s1.index];
      if (!card) return;
      const ok = choice === card.type;
      if (ok) {
        state.s1.score += 15;
        state.s1.lastFeedback = { ok: true, title: '⭕ 정답입니다! (+15점)' };
      } else {
        if (!state.s1.wrongs.some(w => w.id === card.id)) state.s1.wrongs.push(card);
        state.s1.lastFeedback = {
          ok: false,
          title: choice === 'timeout' ? '⏰ 시간이 초과되었어요!' : '❌ 아쉬워요! 다시 생각해 볼까요?'
        };
      }
      saveState();
      render();
    }

    function retryStage1Card() {
      state.s1.lastFeedback = null;
      saveState();
      render();
    }

    function nextStage1Card() {
      state.s1.lastFeedback = null;
      state.s1.index++;
      if (state.s1.index >= state.s1.deck.length) {
        state.s1.done = true;
      }
      saveState();
      render();
    }

    function retryStage1All() {
      state.s1 = { deck: [], index: 0, score: 0, wrongs: [], done: false, lastFeedback: null };
      initStage1IfNeeded();
      saveState();
      render();
    }

    /* =========================================================================
       8. STAGE 2: 3D 마이룸 탐험 (의식주 & 자원의 대체성)
    ========================================================================= */
    function renderStage2(root) {
      const doneCnt = state.s2.completedIds.length;
      const total = STAGE2_SPOTS.length;
      const allDone = doneCnt >= total;
      const activeSpot = STAGE2_SPOTS.find(s => s.id === state.s2.activeSpotId)
        || STAGE2_SPOTS.find(s => !state.s2.completedIds.includes(s.id))
        || STAGE2_SPOTS[0];
      if (!state.s2.activeSpotId && activeSpot) state.s2.activeSpotId = activeSpot.id;

      const res = state.s2.lastResult;

      root.innerHTML = `
        ${renderPurposeBanner('stage2')}
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch animate-pop">
          <!-- 왼쪽: 3D 마이룸 + 스팟 선택 버튼 -->
          <div class="lg:col-span-6 flex flex-col gap-3">
            <div class="canvas-wrap h-[270px] sm:h-[340px]">
              <div id="canvas-s2" class="w-full h-full"></div>
              <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/90 border-2 border-[#3a261f] text-xs font-black">
                🏠 마이룸 미션: ${doneCnt} / ${total} 완료
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              ${STAGE2_SPOTS.map(sp => {
                const done = state.s2.completedIds.includes(sp.id);
                const isCur = state.s2.activeSpotId === sp.id;
                return `
                  <button onclick="selectStage2Spot('${sp.id}')"
                    class="btn-cozy p-2.5 rounded-xl text-left text-xs font-black flex items-center justify-between ${done ? 'bg-[#dcfce7]' : (isCur ? 'bg-[#ffd166]' : 'bg-white')}">
                    <span>${sp.icon} ${sp.title}</span>
                    <span>${done ? '✅' : (isCur ? '👉' : '')}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 오른쪽: 선택지 & 자원 대체성 피드백 -->
          <div class="lg:col-span-6 cozy-card p-6 bg-[#fffdf7] flex flex-col justify-between">
            ${res ? `
              <div class="space-y-4 animate-pop">
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">${res.spotTitle} 결과</span>
                  <span class="px-3 py-1 rounded-full bg-[#dcfce7] border border-[#3a261f] text-xs font-black">+${res.choice.score}점</span>
                </div>
                <div class="p-4 rounded-2xl bg-[#fef9c3] border-2 border-[#3a261f]">
                  <div class="font-black text-sm text-[#3a261f]">${res.choice.tradeoff}</div>
                  <p class="text-xs sm:text-sm font-bold text-[#5c3d32] mt-2">${res.choice.feedback}</p>
                </div>
                <div class="flex flex-wrap gap-2 text-xs font-black">
                  <span class="px-2.5 py-1 rounded-lg bg-[#fef3c7] border border-[#3a261f]">💰 ${res.choice.money >= 0 ? '+' : ''}${res.choice.money.toLocaleString()}P</span>
                  <span class="px-2.5 py-1 rounded-lg bg-[#e0f2fe] border border-[#3a261f]">⏰ ${res.choice.time >= 0 ? '+' : ''}${res.choice.time}h</span>
                  <span class="px-2.5 py-1 rounded-lg bg-[#fce7f3] border border-[#3a261f]">⚡ ${res.choice.health >= 0 ? '+' : ''}${res.choice.health}</span>
                  <span class="px-2.5 py-1 rounded-lg bg-[#dcfce7] border border-[#3a261f]">🌍 ${res.choice.eco >= 0 ? '+' : ''}${res.choice.eco}</span>
                </div>
                <div class="flex flex-wrap gap-2 pt-2">
                  <button onclick="undoStage2Choice()" class="btn-cozy flex-1 py-3 rounded-2xl bg-white font-black text-sm">🔄 다시 선택하기</button>
                  <button onclick="continueStage2()" class="btn-cozy flex-1 py-3 rounded-2xl bg-[#52c498] font-game text-xl">
                    ${allDone ? '🏆 중간 랭킹 보기 →' : '다음 장소로 →'}
                  </button>
                </div>
              </div>
            ` : allDone ? `
              <div class="text-center my-auto space-y-4">
                <div class="text-6xl">🎉</div>
                <h2 class="font-game text-3xl">마이룸 6대 미션 완료!</h2>
                <p class="text-sm font-bold text-[#5c3d32]">의식주 생활자원을 모두 관리했습니다. 이제 중간 랭킹을 확인해 볼까요?</p>
                <button onclick="completeStageAndShowRank('stage2', 'stage3')" class="btn-cozy px-7 py-3.5 rounded-2xl bg-[#52c498] font-game text-2xl">
                  🏆 중간 랭킹 보고 STAGE 3 →
                </button>
              </div>
            ` : `
              <div>
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-3xl">${activeSpot.icon}</span>
                  <h2 class="font-game text-2xl sm:text-3xl">${activeSpot.title}</h2>
                </div>
                <p class="text-sm sm:text-base font-bold text-[#5c3d32] bg-[#fff4dc] p-3.5 rounded-2xl border-2 border-[#3a261f] mb-4">
                  ${activeSpot.situation}
                </p>
                <div class="space-y-2.5">
                  ${activeSpot.choices.map((c, idx) => `
                    <button onclick="chooseStage2('${activeSpot.id}', ${idx})"
                      class="btn-cozy w-full p-4 rounded-2xl bg-white hover:bg-[#f0fdf4] text-left font-bold text-sm flex items-start gap-2.5">
                      <span class="px-2 py-0.5 rounded-lg bg-[#3a261f] text-[#ffd166] text-xs font-black shrink-0">${['A', 'B', 'C'][idx]}</span>
                      <span>${c.label}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            `}
          </div>
        </div>
      `;
      mount3DScene('canvas-s2', buildStage2Room3D);
    }

    function selectStage2Spot(id) {
      if (state.s2.lastResult) return;
      if (state.s2.completedIds.includes(id)) {
        showToast('이미 완료한 장소입니다!', 'info');
        return;
      }
      state.s2.activeSpotId = id;
      saveState();
      render();
    }

    function chooseStage2(spotId, choiceIdx) {
      const spot = STAGE2_SPOTS.find(s => s.id === spotId);
      if (!spot) return;
      const c = spot.choices[choiceIdx];
      // 되돌리기용 스냅샷 저장
      state.s2.snapshot = {
        money: state.money, time: state.time, health: state.health, eco: state.eco, happy: state.happy,
        s2Score: state.s2.score, spotId
      };
      state.money = Math.max(0, state.money + c.money);
      state.time = Math.max(0, state.time + c.time);
      state.health = Math.max(0, Math.min(100, state.health + c.health));
      state.eco = Math.max(0, Math.min(100, state.eco + c.eco));
      state.happy = Math.max(0, Math.min(100, state.happy + c.happy));
      state.s2.score += c.score;
      if (!state.s2.completedIds.includes(spotId)) state.s2.completedIds.push(spotId);
      state.s2.lastResult = { spotTitle: spot.title, choice: c };
      saveState();
      render();
    }

    function undoStage2Choice() {
      const snap = state.s2.snapshot;
      if (!snap) return;
      state.money = snap.money;
      state.time = snap.time;
      state.health = snap.health;
      state.eco = snap.eco;
      state.happy = snap.happy;
      state.s2.score = snap.s2Score;
      state.s2.completedIds = state.s2.completedIds.filter(id => id !== snap.spotId);
      state.s2.activeSpotId = snap.spotId;
      state.s2.lastResult = null;
      state.s2.snapshot = null;
      saveState();
      showToast('자원과 점수를 복구했습니다. 다시 선택해 보세요!', 'info');
      render();
    }

    function continueStage2() {
      state.s2.lastResult = null;
      state.s2.snapshot = null;
      const next = STAGE2_SPOTS.find(s => !state.s2.completedIds.includes(s.id));
      if (!next) {
        completeStageAndShowRank('stage2', 'stage3');
        return;
      }
      state.s2.activeSpotId = next.id;
      saveState();
      render();
    }

    /* =========================================================================
       9. STAGE 3: 3D 자원 순환 공방 (순위 스포일러 제거 + 생애 4단계 안내)
    ========================================================================= */
    function getShuffledStage3Options(item) {
      if (!state.s3.shuffledOpts[item.id]) {
        const idxs = item.options.map((_, i) => i).sort(() => Math.random() - 0.5);
        state.s3.shuffledOpts[item.id] = idxs;
      }
      return state.s3.shuffledOpts[item.id].map(i => ({ idx: i, opt: item.options[i] }));
    }

    function renderStage3(root) {
      const total = STAGE3_ITEMS.length;
      const item = STAGE3_ITEMS[state.s3.index];
      const res = state.s3.lastResult;

      if (state.s3.done || !item) {
        completeStageAndShowRank('stage3', 'session1_end');
        return;
      }

      const opts = getShuffledStage3Options(item);
      root.innerHTML = `
        ${renderPurposeBanner('stage3')}
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch animate-pop">
          <div class="lg:col-span-5 flex flex-col gap-3">
            <div class="canvas-wrap h-[260px] sm:h-[340px]">
              <div id="canvas-s3" class="w-full h-full"></div>
              <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/90 border-2 border-[#3a261f] text-xs font-black">
                ♻️ 자원 순환 공방: ${state.s3.index + 1} / ${total}
              </div>
            </div>

            <!-- 4단계 물건의 생애 과정 -->
            <div class="cozy-panel p-4 bg-[#f0fdf4]">
              <div class="text-xs font-black text-[#065f46] mb-2">🔄 이 물건의 생애 과정</div>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-[11px] font-bold text-center">
                ${item.lifecycle.map((step, i) => `
                  <div class="p-2 rounded-xl border border-[#3a261f] ${i === 3 ? 'bg-[#ffd166] font-black' : 'bg-white'}">
                    <div class="text-[10px] text-[#6b4f45]">${['1. 생산', '2. 소비', '3. 상황', '4. 나의 선택'][i]}</div>
                    <div class="mt-0.5">${step}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="lg:col-span-7 cozy-card p-6 bg-[#fffdf7] flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-3 mb-3">
                <span class="text-5xl">${item.icon}</span>
                <div>
                  <span class="px-2.5 py-0.5 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">어떻게 처리하면 지구에 가장 좋을까요?</span>
                  <h2 class="font-game text-2xl sm:text-3xl mt-1">${item.name}</h2>
                </div>
              </div>

              ${res ? `
                <div class="p-4 rounded-2xl border-2 border-[#3a261f] ${res.rank <= 2 ? 'bg-[#dcfce7]' : 'bg-[#fef3c7]'} space-y-2 animate-pop mt-4">
                  <div class="font-game text-xl text-[#3a261f]">${res.msg}</div>
                  <div class="text-xs font-black text-[#065f46]">획득 점수: +${res.score}점 · 🌍 환경 변화: ${res.eco >= 0 ? '+' : ''}${res.eco}</div>
                  <div class="p-2.5 rounded-xl bg-white/80 border border-[#3a261f] text-xs font-bold text-[#5c3d32]">
                    💡 5R 자원 순환 핵심: <strong>줄이기(Reduce) · 수리(Repair) &gt; 재사용(Reuse) &gt; 분리배출(Recycle) &gt; 폐기</strong>
                  </div>
                  <div class="flex flex-wrap gap-2 pt-2">
                    <button onclick="undoStage3Choice()" class="btn-cozy flex-1 py-3 rounded-2xl bg-white font-black text-sm">🔄 다시 선택하기</button>
                    <button onclick="nextStage3Item()" class="btn-cozy flex-1 py-3 rounded-2xl bg-[#52c498] font-game text-xl">
                      ${state.s3.index + 1 >= total ? '🏆 중간 랭킹 보기 →' : '다음 물건 →'}
                    </button>
                  </div>
                </div>
              ` : `
                <div class="space-y-2.5 mt-4">
                  ${opts.map(({ idx, opt }, i) => `
                    <button onclick="chooseStage3(${idx})"
                      class="btn-cozy w-full p-4 rounded-2xl bg-white hover:bg-[#ecfdf5] text-left font-bold text-sm flex items-center gap-3">
                      <span class="w-7 h-7 rounded-full bg-[#3a261f] text-[#ffd166] flex items-center justify-center text-xs font-black shrink-0">${i + 1}</span>
                      <span>${opt.text}</span>
                    </button>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
      mount3DScene('canvas-s3', buildStage3Workshop3D);
    }

    function chooseStage3(optIdx) {
      const item = STAGE3_ITEMS[state.s3.index];
      if (!item) return;
      const opt = item.options[optIdx];
      state.s3.snapshot = { eco: state.eco, happy: state.happy, s3Score: state.s3.score };
      state.eco = Math.max(0, Math.min(100, state.eco + opt.eco));
      state.happy = Math.max(0, Math.min(100, state.happy + opt.happy));
      state.s3.score += opt.score;
      state.s3.lastResult = opt;
      saveState();
      render();
    }

    function undoStage3Choice() {
      const snap = state.s3.snapshot;
      if (!snap) return;
      state.eco = snap.eco;
      state.happy = snap.happy;
      state.s3.score = snap.s3Score;
      state.s3.lastResult = null;
      state.s3.snapshot = null;
      saveState();
      showToast('선택을 되돌렸습니다. 다시 골라 보세요!', 'info');
      render();
    }

    function nextStage3Item() {
      state.s3.lastResult = null;
      state.s3.snapshot = null;
      state.s3.index++;
      if (state.s3.index >= STAGE3_ITEMS.length) {
        state.s3.done = true;
        completeStageAndShowRank('stage3', 'session1_end');
        return;
      }
      saveState();
      render();
    }

    /* =========================================================================
       10. 1차시 종료 리포트
    ========================================================================= */
    function renderSession1End(root) {
      destroy3D();
      const sc = calcTotalScore();
      root.innerHTML = `
        <div class="max-w-3xl mx-auto cozy-card p-7 sm:p-10 bg-[#fff4dc] text-center space-y-5 animate-pop">
          <div class="text-6xl animate-float">🎉</div>
          <span class="px-3 py-1 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">1차시 활동 완료 리포트</span>
          <h2 class="font-game text-3xl sm:text-4xl text-[#3a261f]">${escapeHtml(state.nickname)}님, 1차시 미션 클리어!</h2>
          <div class="grid grid-cols-3 gap-3 max-w-lg mx-auto">
            <div class="cozy-panel p-3 bg-white"><div class="text-xs font-bold">STAGE 1</div><div class="font-game text-2xl text-[#1d4ed8]">${sc.s1}점</div></div>
            <div class="cozy-panel p-3 bg-white"><div class="text-xs font-bold">STAGE 2</div><div class="font-game text-2xl text-[#059669]">${sc.s2}점</div></div>
            <div class="cozy-panel p-3 bg-white"><div class="text-xs font-bold">STAGE 3</div><div class="font-game text-2xl text-[#d97706]">${sc.s3}점</div></div>
          </div>
          <p class="text-sm font-bold text-[#5c3d32]">
            생활자원의 종류, 자원의 대체성, 5R 자원 순환을 모두 체험했습니다.<br/>
            이제 2차시 <strong>「코비의 시간관리 매트릭스」</strong>로 넘어가 볼까요?
          </p>
          <button onclick="initStage4IfNeeded(); goScreen('stage4')" class="btn-cozy px-8 py-4 rounded-2xl bg-[#70d6ff] font-game text-2xl">
            ⏰ 2차시 STAGE 4 시작하기 →
          </button>
        </div>
      `;
    }

    /* =========================================================================
       11. STAGE 4: 코비의 시간관리 매트릭스 + 쇼츠 도둑
    ========================================================================= */
    function initStage4IfNeeded() {
      if (!state.s4.placements) state.s4.placements = {};
    }

    function renderStage4(root) {
      destroy3D();
      initStage4IfNeeded();
      const placedIds = Object.keys(state.s4.placements);
      const unplaced = STAGE4_TASKS.filter(t => !state.s4.placements[t.id]);
      const allPlaced = unplaced.length === 0;
      const d1 = !!state.s4.d1Mode;

      const quads = [
        { q: 1, title: '1사분면: 긴급 + 중요', sub: '지금 바로 해야 하는 위기·마감', bg: 'bg-[#fee2e2]' },
        { q: 2, title: '2사분면: 중요 + 비긴급 ⭐', sub: '내 미래를 키우는 핵심 투자!', bg: 'bg-[#dcfce7]' },
        { q: 3, title: '3사분면: 긴급 + 비중요', sub: '급해 보이지만 남의 일·방해', bg: 'bg-[#fef3c7]' },
        { q: 4, title: '4사분면: 비긴급 + 비중요', sub: '시간을 훔쳐가는 유혹·낭비', bg: 'bg-[#f1f5f9]' }
      ];

      root.innerHTML = `
        ${renderPurposeBanner('stage4')}
        <div class="space-y-4 animate-pop">
          <!-- 상단 컨트롤: D-30 vs D-1 체험 스위치 -->
          <div class="cozy-panel p-3.5 bg-white flex flex-wrap items-center justify-between gap-2">
            <div class="text-xs sm:text-sm font-black">
              배치 현황: <span class="text-[#1d4ed8]">${placedIds.length} / 12개</span>
              <span class="text-[#6b4f45] font-bold ml-2">(카드를 클릭한 뒤 원하는 사분면을 누르세요!)</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleStage4D1()" class="btn-cozy px-3 py-1.5 rounded-xl text-xs font-black ${d1 ? 'bg-[#ff6b6b] text-white' : 'bg-[#e0f2fe]'}">
                ${d1 ? '🚨 시험 D-1 모드 (긴급도 상승 체험 중!)' : '📅 시험 D-30 ➔ D-1 긴급도 변화 체험'}
              </button>
              <button onclick="resetStage4()" class="btn-cozy px-3 py-1.5 rounded-xl bg-white text-xs font-black">🔄 다시 배치하기</button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <!-- 왼쪽: 대기 카드 -->
            <div class="lg:col-span-4 cozy-card p-4 bg-[#fffdf7]">
              <h3 class="font-game text-xl mb-2">📌 분류할 활동 카드 (${unplaced.length})</h3>
              <div class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                ${unplaced.map(t => `
                  <button onclick="selectStage4Task('${t.id}')"
                    class="btn-cozy w-full p-3 rounded-xl text-left text-xs sm:text-sm font-bold flex items-center gap-2 ${state.s4.selectedTaskId === t.id ? 'bg-[#ffd166] ring-2 ring-[#d95d39]' : 'bg-white'}">
                    <span class="text-xl">${t.icon}</span>
                    <span>${d1 && t.dynamicD1 ? '🚨 [내일이 시험!] 벼락치기 시험 공부' : t.label}</span>
                  </button>
                `).join('') || `<div class="p-6 text-center text-sm font-black text-[#065f46] bg-[#dcfce7] rounded-2xl border-2 border-[#3a261f]">✅ 12개 카드를 모두 배치했습니다!</div>`}
              </div>

              ${allPlaced && !state.s4.analyzed ? `
                <button onclick="analyzeStage4()" class="btn-cozy w-full mt-4 py-3.5 rounded-2xl bg-[#52c498] font-game text-2xl">
                  📊 내 시간관리 분석하기!
                </button>
              ` : ''}

              ${state.s4.analyzed ? `
                <div class="mt-4 p-4 rounded-2xl bg-[#fef9c3] border-2 border-[#3a261f] space-y-2">
                  <div class="font-game text-2xl text-[#3a261f]">분석 완료! (${state.s4.score}점)</div>
                  <p class="text-xs font-bold text-[#5c3d32]">2사분면(중요·비긴급)을 미리 챙길수록 1사분면 위기가 줄어듭니다!</p>
                  <div class="flex gap-2 pt-1">
                    <button onclick="resetStage4()" class="btn-cozy flex-1 py-2.5 rounded-xl bg-white text-xs font-black">🔄 다시 배치</button>
                    <button onclick="completeStageAndShowRank('stage4', 'stage5')" class="btn-cozy flex-1 py-2.5 rounded-xl bg-[#52c498] font-game text-lg">🏆 중간 랭킹 →</button>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- 오른쪽: 코비 4사분면 보드 -->
            <div class="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${quads.map(q => {
                const items = STAGE4_TASKS.filter(t => state.s4.placements[t.id] === q.q);
                return `
                  <div onclick="placeStage4Task(${q.q})"
                    class="cozy-card p-4 ${q.bg} min-h-[210px] cursor-pointer hover:brightness-95 transition">
                    <div class="font-game text-lg sm:text-xl text-[#3a261f]">${q.title}</div>
                    <div class="text-[11px] font-bold text-[#5c3d32] mb-2.5">${q.sub}</div>
                    <div class="space-y-1.5">
                      ${items.map(t => {
                        const targetBest = (d1 && t.dynamicD1) ? 1 : t.best;
                        const ok = state.s4.analyzed && targetBest === q.q;
                        const wrong = state.s4.analyzed && targetBest !== q.q;
                        return `
                          <div onclick="event.stopPropagation(); removeStage4Task('${t.id}')" title="클릭하면 꺼내기"
                            class="px-2.5 py-2 rounded-xl bg-white border-2 ${ok ? 'border-[#10b981]' : (wrong ? 'border-[#ef4444]' : 'border-[#3a261f]')} text-xs font-bold flex items-center justify-between gap-1">
                            <span>${t.icon} ${d1 && t.dynamicD1 ? '🚨 내일 시험 공부' : t.label}</span>
                            <span class="text-[10px] font-black shrink-0">${state.s4.analyzed ? (ok ? '⭕' : `➔${targetBest}사분면`) : '✖'}</span>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      // 쇼츠 도둑 미니 방해 이벤트 (분석 전 랜덤 1회)
      if (!state.s4.analyzed && state.s4.thiefResisted === 0 && placedIds.length >= 4) {
        thiefTimer = setTimeout(() => showShortsThief(), 1500);
      }
    }

    function showShortsThief() {
      if (state.screen !== 'stage4' || state.s4.analyzed) return;
      openConfirmModal(
        '📱 쇼츠 도둑 출현! "딱 1분만 볼래?"',
        '유혹을 물리치고 [확인]을 누르면 집중력 보너스 +15점을 받습니다!',
        () => {
          state.s4.thiefResisted = 1;
          state.s4.score += 15;
          saveState();
          showToast('🔥 쇼츠 도둑을 물리쳤습니다! (+15점)', 'good');
          updateHUD();
        }
      );
    }

    function selectStage4Task(id) {
      state.s4.selectedTaskId = id;
      render();
    }

    function placeStage4Task(q) {
      if (state.s4.analyzed) return;
      const tid = state.s4.selectedTaskId || (STAGE4_TASKS.find(t => !state.s4.placements[t.id]) || {}).id;
      if (!tid) return;
      state.s4.placements[tid] = q;
      state.s4.selectedTaskId = null;
      saveState();
      render();
    }

    function removeStage4Task(tid) {
      if (state.s4.analyzed) return;
      delete state.s4.placements[tid];
      state.s4.selectedTaskId = tid;
      saveState();
      render();
    }

    function toggleStage4D1() {
      state.s4.d1Mode = !state.s4.d1Mode;
      showToast(state.s4.d1Mode ? '🚨 시험 D-1! 2사분면 시험 공부가 1사분면 위기로 바뀝니다!' : '📅 시험 D-30 기본 모드로 돌아왔습니다.', 'info');
      render();
    }

    function analyzeStage4() {
      const d1 = !!state.s4.d1Mode;
      let correct = 0;
      STAGE4_TASKS.forEach(t => {
        const expected = (d1 && t.dynamicD1) ? 1 : t.best;
        if (state.s4.placements[t.id] === expected) correct++;
      });
      state.s4.score = correct * 15 + (state.s4.thiefResisted ? 15 : 0);
      state.s4.analyzed = true;
      saveState();
      showToast(`12개 중 ${correct}개 정확히 분류했습니다!`, 'good');
      render();
    }

    function resetStage4() {
      state.s4.placements = {};
      state.s4.selectedTaskId = null;
      state.s4.analyzed = false;
      state.s4.score = state.s4.thiefResisted ? 15 : 0;
      saveState();
      render();
    }

    /* =========================================================================
       12. STAGE 5: 3D 에코 타운
    ========================================================================= */
    function renderStage5(root) {
      const total = STAGE5_EVENTS.length;
      const ev = STAGE5_EVENTS[state.s5.activeIdx];
      const res = state.s5.lastResult;

      if (state.s5.doneIds.length >= total && !res) {
        completeStageAndShowRank('stage5', 'final');
        return;
      }

      root.innerHTML = `
        ${renderPurposeBanner('stage5')}
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch animate-pop">
          <div class="lg:col-span-6 canvas-wrap h-[280px] sm:h-[380px]">
            <div id="canvas-s5" class="w-full h-full"></div>
            <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/90 border-2 border-[#3a261f] text-xs font-black">
              🌍 3D 에코 타운 (${state.s5.doneIds.length} / ${total}) · 환경 지수 ${state.eco}
            </div>
          </div>

          <div class="lg:col-span-6 cozy-card p-6 bg-[#fffdf7] flex flex-col justify-between">
            ${res ? `
              <div class="space-y-4 animate-pop">
                <div class="font-game text-2xl text-[#065f46]">${res.eco >= 0 ? '🌱 에코 타운이 더 푸르러졌어요!' : '🌫️ 에코 타운이 조금 흐려졌어요!'}</div>
                <p class="text-sm font-bold text-[#3a261f] p-4 rounded-2xl bg-[#fef9c3] border-2 border-[#3a261f]">${res.fb}</p>
                <div class="flex gap-2 text-xs font-black">
                  <span class="px-3 py-1 rounded-lg bg-[#dcfce7] border border-[#3a261f]">⭐ +${res.score}점</span>
                  <span class="px-3 py-1 rounded-lg bg-[#e0f2fe] border border-[#3a261f]">🌍 ${res.eco >= 0 ? '+' : ''}${res.eco}</span>
                  <span class="px-3 py-1 rounded-lg bg-[#fef3c7] border border-[#3a261f]">💰 ${res.money >= 0 ? '+' : ''}${res.money.toLocaleString()}P</span>
                </div>
                <div class="flex gap-2 pt-2">
                  <button onclick="undoStage5Choice()" class="btn-cozy flex-1 py-3 rounded-2xl bg-white font-black text-sm">🔄 다시 선택하기</button>
                  <button onclick="nextStage5Event()" class="btn-cozy flex-1 py-3 rounded-2xl bg-[#52c498] font-game text-xl">
                    ${state.s5.activeIdx + 1 >= total ? '🏆 중간 랭킹 보기 →' : '다음 미션 →'}
                  </button>
                </div>
              </div>
            ` : `
              <div>
                <div class="flex items-center gap-3 mb-3">
                  <span class="text-4xl">${ev.icon}</span>
                  <h2 class="font-game text-2xl sm:text-3xl">${ev.title}</h2>
                </div>
                <p class="text-sm font-bold text-[#5c3d32] bg-[#ecfdf5] p-4 rounded-2xl border-2 border-[#3a261f] mb-4">${ev.desc}</p>
                <div class="space-y-2.5">
                  ${ev.choices.map((c, idx) => `
                    <button onclick="chooseStage5(${idx})"
                      class="btn-cozy w-full p-4 rounded-2xl bg-white hover:bg-[#f0fdf4] text-left font-bold text-sm flex items-start gap-2.5">
                      <span class="px-2 py-0.5 rounded-lg bg-[#3a261f] text-[#ffd166] text-xs font-black shrink-0">${idx + 1}</span>
                      <span>${c.label}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            `}
          </div>
        </div>
      `;
      mount3DScene('canvas-s5', buildStage5EcoTown3D);
    }

    function chooseStage5(idx) {
      const ev = STAGE5_EVENTS[state.s5.activeIdx];
      if (!ev) return;
      const c = ev.choices[idx];
      state.s5.snapshot = { eco: state.eco, money: state.money, happy: state.happy, s5Score: state.s5.score, evId: ev.id };
      state.eco = Math.max(0, Math.min(100, state.eco + c.eco));
      state.money = Math.max(0, state.money + c.money);
      state.happy = Math.max(0, Math.min(100, state.happy + c.happy));
      state.s5.score += c.score;
      if (!state.s5.doneIds.includes(ev.id)) state.s5.doneIds.push(ev.id);
      state.s5.lastResult = c;
      saveState();
      render();
    }

    function undoStage5Choice() {
      const snap = state.s5.snapshot;
      if (!snap) return;
      state.eco = snap.eco;
      state.money = snap.money;
      state.happy = snap.happy;
      state.s5.score = snap.s5Score;
      state.s5.doneIds = state.s5.doneIds.filter(id => id !== snap.evId);
      state.s5.lastResult = null;
      state.s5.snapshot = null;
      saveState();
      showToast('선택을 되돌렸습니다!', 'info');
      render();
    }

    function nextStage5Event() {
      state.s5.lastResult = null;
      state.s5.snapshot = null;
      state.s5.activeIdx++;
      if (state.s5.activeIdx >= STAGE5_EVENTS.length) {
        completeStageAndShowRank('stage5', 'final');
        return;
      }
      saveState();
      render();
    }

    /* =========================================================================
       13. 스테이지별 실시간 중간 랭킹 화면
    ========================================================================= */
    async function completeStageAndShowRank(completedStage, nextStage) {
      state.lastCompletedStage = completedStage;
      state.nextStageAfterRank = nextStage;
      await submitRecordToRanking(false);
      goScreen('stage_rank');
    }

    function renderStageRank(root) {
      destroy3D();
      const stKey = state.lastCompletedStage || 'stage1';
      const stNum = stKey.replace('stage', '');
      const scoreField = 's' + stNum;
      const meta = STAGE_META[stKey] || STAGE_META.stage1;
      const ranks = getClassRanks(state.classRoom);

      const sorted = [...ranks].sort((a, b) => {
        if (stageRankViewMode === 'stage') return (b[scoreField] || 0) - (a[scoreField] || 0) || (b.total || 0) - (a.total || 0);
        return (b.total || 0) - (a.total || 0);
      });
      const myIdx = sorted.findIndex(r => r.nickname === state.nickname);

      root.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-4 animate-pop">
          <div class="cozy-card p-6 bg-[#fff4dc] text-center">
            <span class="px-3 py-1 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">${state.classRoom}반 실시간 중간 랭킹</span>
            <h2 class="font-game text-3xl sm:text-4xl text-[#d95d39] mt-2">🏆 STAGE ${stNum} 완료! 우리 반 순위</h2>
            <p class="text-xs sm:text-sm font-bold text-[#5c3d32] mt-1">
              ${myIdx >= 0 ? `현재 ${escapeHtml(state.nickname)}님의 순위는 <strong>${myIdx + 1}위</strong>입니다!` : '우리 반 친구들의 점수가 실시간으로 집계됩니다.'}
            </p>

            <!-- 핵심 배움 정리 -->
            <div class="mt-4 p-4 rounded-2xl bg-white border-2 border-[#3a261f] text-left">
              <div class="text-xs font-black text-[#1d4ed8]">💡 STAGE ${stNum} 핵심 배움 정리</div>
              <p class="text-xs sm:text-sm font-bold text-[#3a261f] mt-1">${meta.takeaway}</p>
              <div class="text-xs font-black text-[#059669] mt-2">⏭️ 다음 예고: ${meta.nextPreview}</div>
            </div>

            <div class="flex flex-wrap justify-center gap-2 mt-4">
              <button onclick="stageRankViewMode='stage'; render();" class="btn-cozy px-4 py-2 rounded-xl text-xs font-black ${stageRankViewMode === 'stage' ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">ST ${stNum} 점수순</button>
              <button onclick="stageRankViewMode='total'; render();" class="btn-cozy px-4 py-2 rounded-xl text-xs font-black ${stageRankViewMode === 'total' ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">누적 총점순</button>
              <button onclick="render()" class="btn-cozy px-4 py-2 rounded-xl bg-[#e0f2fe] text-xs font-black">🔄 순위 새로고침</button>
            </div>
          </div>

          <!-- TOP 3 & 전체 순위표 -->
          <div class="cozy-card p-5 bg-[#fffdf7]">
            <div class="space-y-2">
              ${sorted.map((r, i) => `
                <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-[#3a261f] ${r.nickname === state.nickname ? 'bg-[#ffd166]' : 'bg-white'}">
                  <div class="flex items-center gap-3">
                    <span class="font-game text-xl w-8 text-center">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '위'}</span>
                    <div>
                      <div class="font-black text-sm">${escapeHtml(r.nickname)}${r.nickname === state.nickname ? ' (나)' : ''}</div>
                      <div class="text-[11px] font-bold text-[#6b4f45]">🌍 환경 ${r.eco ?? 70} · 누적 ${r.total || 0}점</div>
                    </div>
                  </div>
                  <div class="font-game text-2xl text-[#1d4ed8]">
                    ${stageRankViewMode === 'stage' ? (r[scoreField] || 0) : (r.total || 0)}점
                  </div>
                </div>
              `).join('') || `<p class="text-center text-sm font-bold text-[#6b4f45] py-6">아직 등록된 기록이 없습니다.</p>`}
            </div>
          </div>

          <div class="text-center">
            <button onclick="proceedAfterStageRank()" class="btn-cozy px-8 py-4 rounded-2xl bg-[#52c498] font-game text-2xl">
              🚀 다음 단계로 이동하기 →
            </button>
          </div>
        </div>
      `;
    }

    function proceedAfterStageRank() {
      const next = state.nextStageAfterRank || 'stage2';
      if (next === 'stage4') initStage4IfNeeded();
      goScreen(next);
    }

    /* =========================================================================
       14. 최종 성적표 & If-Then 실천 다짐 & 우리 반 랭킹/공동 지구
    ========================================================================= */
    function renderFinal(root) {
      destroy3D();
      const sc = calcTotalScore();
      const prof = getLifestyleProfile();

      root.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-5 animate-pop">
          <div class="cozy-card p-6 sm:p-8 bg-[#fffdf7]">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-dashed border-[#3a261f]/20 pb-4">
              <div>
                <span class="px-3 py-1 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">나의 1일 자원관리 포트폴리오</span>
                <h2 class="font-game text-3xl sm:text-4xl mt-1">${state.classRoom}반 ${escapeHtml(state.nickname || '학생')}</h2>
              </div>
              <div class="text-right">
                <div class="text-xs font-black text-[#6b4f45]">최종 종합 점수</div>
                <div class="font-game text-4xl text-[#d95d39]">${sc.total}점</div>
              </div>
            </div>

            <div class="mt-4 p-4 rounded-2xl bg-[#fef9c3] border-2 border-[#3a261f]">
              <div class="font-game text-2xl">${prof.title}</div>
              <p class="text-xs sm:text-sm font-bold text-[#5c3d32] mt-1">${prof.desc}</p>
            </div>

            <!-- 5대 스테이지 점수 -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mt-4 text-center">
              ${[
                ['ST1 자원감별', sc.s1], ['ST2 마이룸', sc.s2], ['ST3 자원순환', sc.s3], ['ST4 시간관리', sc.s4], ['ST5 에코타운', sc.s5]
              ].map(([k, v]) => `
                <div class="cozy-panel p-3 bg-white">
                  <div class="text-[11px] font-black text-[#6b4f45]">${k}</div>
                  <div class="font-game text-2xl text-[#1d4ed8] mt-0.5">${v}점</div>
                </div>
              `).join('')}
            </div>

            <!-- If-Then 실천 다짐 -->
            <div class="mt-6 p-5 rounded-2xl bg-[#ecfdf5] border-2 border-[#3a261f] space-y-3">
              <h3 class="font-game text-2xl text-[#065f46]">🌱 나의 If-Then 생활자원 실천 다짐</h3>
              <p class="text-xs font-bold text-[#334155]">구체적인 상황(If)과 행동(Then)을 적으면 실천 성공률이 3배 높아집니다!</p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input id="pledge-when" value="${escapeHtml(state.pledge.when)}" placeholder="언제/상황 (예: 편의점에 갈 때)"
                  class="px-3 py-2.5 rounded-xl border-2 border-[#3a261f] bg-white text-xs sm:text-sm font-bold" />
                <input id="pledge-instead" value="${escapeHtml(state.pledge.instead)}" placeholder="줄일 습관 (예: 충동구매 대신)"
                  class="px-3 py-2.5 rounded-xl border-2 border-[#3a261f] bg-white text-xs sm:text-sm font-bold" />
                <input id="pledge-action" value="${escapeHtml(state.pledge.action)}" placeholder="실천 행동 (예: 꼭 필요한 1개만 사겠다!)"
                  class="px-3 py-2.5 rounded-xl border-2 border-[#3a261f] bg-white text-xs sm:text-sm font-bold" />
              </div>
            </div>

            <div class="no-print flex flex-wrap justify-center gap-3 mt-6">
              <button onclick="window.print()" class="btn-cozy px-5 py-3 rounded-2xl bg-white font-black text-sm">🖨️ 결과지 인쇄 / PDF 저장</button>
              <button onclick="savePledgeAndGoRanking()" class="btn-cozy px-7 py-3 rounded-2xl bg-[#52c498] font-game text-2xl">🏆 다짐 등록 & 우리 반 랭킹 보기 →</button>
            </div>
          </div>
        </div>
      `;
    }

    async function savePledgeAndGoRanking() {
      const w = document.getElementById('pledge-when');
      const i = document.getElementById('pledge-instead');
      const a = document.getElementById('pledge-action');
      state.pledge = {
        when: w ? w.value.trim() : '',
        instead: i ? i.value.trim() : '',
        action: a ? a.value.trim() : ''
      };
      rankingClassView = state.classRoom;
      state.screen = 'ranking';
      saveState();
      await submitRecordToRanking(true);
      render();
    }

    function renderRanking(root) {
      destroy3D();
      const ranks = getClassRanks(rankingClassView);
      const sorted = [...ranks].sort((a, b) => {
        if (rankingSort === 'eco') return (b.eco || 0) - (a.eco || 0);
        return (b.total || 0) - (a.total || 0);
      });
      const avgEco = ranks.length > 0 ? Math.round(ranks.reduce((s, r) => s + (r.eco ?? 70), 0) / ranks.length) : 70;
      const earthEmoji = avgEco >= 80 ? '🌍✨' : (avgEco >= 60 ? '🌍🌱' : '🌫️🌍');

      root.innerHTML = `
        <div class="space-y-5 animate-pop">
          <!-- 우리 반 공동 지구 게이지 -->
          <div class="cozy-card p-6 bg-[#ecfdf5] text-center">
            <div class="text-5xl mb-1">${earthEmoji}</div>
            <span class="px-3 py-1 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">${rankingClassView}반 공동 지구 게이지 (Class Eco-Meter)</span>
            <h2 class="font-game text-3xl sm:text-4xl text-[#065f46] mt-2">우리 반 평균 환경 지수: ${avgEco}점</h2>
            <div class="max-w-xl mx-auto mt-3 h-5 rounded-full bg-white border-2 border-[#3a261f] overflow-hidden">
              <div class="h-full bg-gradient-to-r from-[#34d399] to-[#059669] transition-all" style="width:${Math.min(100, avgEco)}%"></div>
            </div>
            <p class="text-xs font-bold text-[#334155] mt-2">나 혼자 1등이어도 우리 반 전체의 환경 지수가 높아야 지구가 건강해집니다!</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- 랭킹표 -->
            <div class="lg:col-span-7 cozy-card p-5 bg-[#fffdf7]">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h3 class="font-game text-2xl">🏆 ${rankingClassView}반 명예의 전당</h3>
                <div class="flex gap-1.5">
                  <button onclick="rankingSort='total'; render();" class="btn-cozy px-3 py-1 rounded-xl text-xs font-black ${rankingSort === 'total' ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">총점순</button>
                  <button onclick="rankingSort='eco'; render();" class="btn-cozy px-3 py-1 rounded-xl text-xs font-black ${rankingSort === 'eco' ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">환경순</button>
                  <button onclick="render()" class="btn-cozy px-3 py-1 rounded-xl bg-[#e0f2fe] text-xs font-black">🔄</button>
                </div>
              </div>
              <div class="space-y-2">
                ${sorted.map((r, i) => `
                  <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-[#3a261f] ${r.nickname === state.nickname ? 'bg-[#ffd166]' : 'bg-white'}">
                    <div class="flex items-center gap-3">
                      <span class="font-game text-xl w-8 text-center">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)}</span>
                      <div>
                        <div class="font-black text-sm">${escapeHtml(r.nickname)}</div>
                        <div class="text-[11px] font-bold text-[#6b4f45]">${escapeHtml(r.title || '자원 매니저')} · 🌍 ${r.eco ?? 70}</div>
                      </div>
                    </div>
                    <div class="font-game text-2xl text-[#d95d39]">${r.total || 0}점</div>
                  </div>
                `).join('') || `<p class="text-center text-sm font-bold text-[#6b4f45] py-8">아직 등록된 기록이 없습니다.</p>`}
              </div>
            </div>

            <!-- 우리 반 실천 다짐 담벼락 -->
            <div class="lg:col-span-5 cozy-card p-5 bg-[#fff4dc]">
              <h3 class="font-game text-2xl mb-3">💌 ${rankingClassView}반 실천 다짐 담벼락</h3>
              <div class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                ${sorted.filter(r => r.pledge).map(r => `
                  <div class="cozy-panel p-3.5 bg-white">
                    <div class="flex items-center justify-between">
                      <span class="font-black text-xs text-[#1d4ed8]">👤 ${escapeHtml(r.nickname)}</span>
                      <button onclick="cheerPledge('${escapeHtml(r.classRoom)}', '${escapeHtml(r.nickname)}')"
                        class="px-2.5 py-0.5 rounded-full bg-[#fce7f3] border border-[#3a261f] text-[11px] font-black hover:bg-[#fbcfe8]">
                        👏 응원해요 (${r.cheers || 0})
                      </button>
                    </div>
                    <p class="text-xs sm:text-sm font-bold text-[#3a261f] mt-1.5">"${escapeHtml(r.pledge)}"</p>
                  </div>
                `).join('') || `<p class="text-center text-xs font-bold text-[#6b4f45] py-8">다짐을 작성하면 여기에 표시됩니다!</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function cheerPledge(cls, nick) {
      const target = liveRanks.find(r => (r.classRoom || '1-1') === cls && r.nickname === nick);
      if (target) {
        target.cheers = (target.cheers || 0) + 1;
        localStorage.setItem(STORAGE_KEY_RANKS, JSON.stringify(liveRanks));
        render();
      }
    }

    /* =========================================================================
       15. 교사 비밀 입장 & 실시간 접속·활동 관제 대시보드
    ========================================================================= */
    function handleSecretAvatarTap() {
      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);
      if (secretTapCount >= 5) {
        secretTapCount = 0;
        openTeacherMode();
      }
    }

    function openTeacherMode() {
      if (isTeacherAuthed) {
        goScreen('teacher');
        return;
      }
      document.getElementById('pin-error').classList.add('hidden');
      const inp = document.getElementById('pin-input');
      inp.value = '';
      document.getElementById('pin-modal').classList.remove('hidden');
      setTimeout(() => inp.focus(), 60);
    }

    function closePinModal() {
      document.getElementById('pin-modal').classList.add('hidden');
    }

    function submitTeacherPin() {
      const val = document.getElementById('pin-input').value.trim();
      if (val === teacherPin) {
        isTeacherAuthed = true;
        closePinModal();
        showToast('👩‍🏫 교사 관제 모드로 입장했습니다!', 'good');
        goScreen('teacher');
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function lockTeacherMode() {
      isTeacherAuthed = false;
      isDemoMode = false;
      showToast('🔒 교사 모드가 잠겼습니다.', 'info');
      goScreen('start');
    }

    function renderTeacher(root) {
      destroy3D();
      const ctrl = getClassControl(teacherClassView);
      const classRanks = getClassRanks(teacherClassView);
      const sorted = [...classRanks].sort((a, b) => (b.total || 0) - (a.total || 0));

      root.innerHTML = `
        <div class="space-y-4 animate-pop">
          <!-- 상단 교사 헤더 & 반 전환 -->
          <div class="cozy-card p-5 bg-[#3a261f] text-white flex flex-wrap items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-full bg-[#ffd166] text-[#3a261f] text-xs font-black">👩‍🏫 교사 전용 관제 센터</span>
                <span class="text-xs font-bold text-[#a7f3d0]">${supaConfig.url ? '🌐 외부 공유 서버 연결됨' : '💻 로컬/멀티탭 실시간 동기화'}</span>
              </div>
              <h2 class="font-game text-2xl sm:text-3xl mt-1">${teacherClassView}반 실시간 수업 관리</h2>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openQrModal('${teacherClassView}')" class="btn-cozy px-4 py-2 rounded-xl bg-[#ffd166] text-[#3a261f] text-xs font-black">📱 ${teacherClassView}반 QR 띄우기</button>
              <button onclick="startDemoMode('stage1')" class="btn-cozy px-4 py-2 rounded-xl bg-[#70d6ff] text-[#3a261f] text-xs font-black">🖥️ 시범 예시 화면</button>
              <button onclick="lockTeacherMode()" class="btn-cozy px-4 py-2 rounded-xl bg-[#fda4af] text-[#3a261f] text-xs font-black">🔒 교사 잠금</button>
            </div>
          </div>

          <!-- 1-1 ~ 1-8 반 선택 바 -->
          <div class="cozy-panel p-3 bg-white flex flex-wrap items-center gap-1.5">
            <span class="text-xs font-black text-[#6b4f45] mr-1">관리할 반 선택:</span>
            ${CLASSES.map(cls => {
              const cnt = getClassRanks(cls).length;
              return `
                <button onclick="teacherClassView='${cls}'; renderTeacher(document.getElementById('app-root'));"
                  class="px-3 py-1.5 rounded-xl border-2 border-[#3a261f] text-xs font-black ${teacherClassView === cls ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-[#fffdf7]'}">
                  ${cls}반 (${cnt})
                </button>
              `;
            }).join('')}
          </div>

          <!-- 탭 메뉴 -->
          <div class="flex flex-wrap gap-2">
            ${[
              ['monitor', '👀 실시간 접속·활동 관제'],
              ['control', '🎛️ 세부 단계 통제 & 설정'],
              ['demo', '🖥️ 교사 예시 화면 & 전광판'],
              ['sheet', '📊 제출 현황 & 시트·한셀 내보내기'],
              ['supa', '🌐 외부 배포용 공유 서버 연결']
            ].map(([k, lbl]) => `
              <button onclick="teacherTab='${k}'; renderTeacher(document.getElementById('app-root'));"
                class="btn-cozy px-4 py-2.5 rounded-2xl font-black text-xs sm:text-sm ${teacherTab === k ? 'bg-[#52c498]' : 'bg-white'}">${lbl}</button>
            `).join('')}
          </div>

          <!-- 탭 내용 -->
          ${teacherTab === 'monitor' ? renderTeacherMonitorTab(ctrl, sorted) : ''}
          ${teacherTab === 'control' ? renderTeacherControlTab(ctrl) : ''}
          ${teacherTab === 'demo' ? renderTeacherDemoTab(sorted) : ''}
          ${teacherTab === 'sheet' ? renderTeacherSheetTab(sorted) : ''}
          ${teacherTab === 'supa' ? renderTeacherSupaTab() : ''}
        </div>
      `;
    }

    function renderTeacherMonitorTab(ctrl, sorted) {
      const curIdx = Math.max(0, STAGE_ORDER.indexOf(ctrl.unlockedStage || 'lobby'));
      const nextStage = STAGE_ORDER[curIdx + 1] || null;
      const lobbyCnt = sorted.filter(r => r.studentStatus === 'lobby' || r.currentStage === 'lobby').length;
      const activeCnt = sorted.filter(r => r.studentStatus === 'active').length;
      const waitCnt = sorted.filter(r => r.studentStatus === 'waiting' || r.studentStatus === 'done').length;

      const filtered = sorted.filter(r => {
        if (monitorFilter === 'lobby') return r.studentStatus === 'lobby' || r.currentStage === 'lobby';
        if (monitorFilter === 'active') return r.studentStatus === 'active';
        if (monitorFilter === 'waiting') return r.studentStatus === 'waiting' || r.studentStatus === 'done';
        return true;
      });

      const formatAgo = ts => {
        if (!ts) return '접속 중';
        const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (sec < 10) return '방금 전';
        if (sec < 60) return `${sec}초 전`;
        return `${Math.floor(sec / 60)}분 전`;
      };

      return `
        <div class="space-y-4">
          <div class="cozy-card p-5 bg-[#e0f2fe] space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="px-2.5 py-0.5 rounded-full bg-[#3a261f] text-[#ffd166] text-xs font-black">${teacherClassView}반 원클릭 수업 관제</span>
                <h3 class="font-game text-2xl sm:text-3xl mt-1">
                  현재 단계: ${ctrl.enabled ? (STAGE_LABELS[ctrl.unlockedStage] || '출석 대기실') : '🔓 자유 진행 모드 (통제 OFF)'}
                </h3>
                <p class="text-xs font-bold text-[#1e3a8a] mt-0.5">
                  ① [🚪 출석 대기실 열기]로 학생들을 모은 뒤 → ② 아래 접속 인원을 확인하고 → ③ [🚀 다음으로 전원 이동!]을 누르세요.
                </p>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="openLobbyForClass('${teacherClassView}')" class="btn-cozy px-4 py-3 rounded-2xl bg-[#ffd166] font-black text-xs sm:text-sm">
                  🚪 출석 대기실 열기 (모두 모이기)
                </button>
                ${nextStage ? `
                  <button onclick="advanceNextStageForClass('${teacherClassView}')" class="btn-cozy px-5 py-3 rounded-2xl bg-[#52c498] font-game text-lg sm:text-xl">
                    🚀 다음으로 전원 이동! (${STAGE_LABELS[nextStage].split(' (')[0]})
                  </button>
                ` : `
                  <button onclick="unlockTeacherStage('${teacherClassView}', 'ranking')" class="btn-cozy px-5 py-3 rounded-2xl bg-[#52c498] font-game text-lg">
                    🏆 최종 랭킹 화면 열기
                  </button>
                `}
                <button onclick="toggleTeacherPause('${teacherClassView}')" class="btn-cozy px-4 py-3 rounded-2xl ${ctrl.paused ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-[#fda4af]'} font-black text-xs sm:text-sm">
                  ${ctrl.paused ? '▶️ 수업 재개' : '⏸️ 전체 일시정지'}
                </button>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 pt-2 border-t-2 border-dashed border-[#3a261f]/20">
              ${STAGE_ORDER.map((st, idx) => {
                const isCur = ctrl.enabled && ctrl.unlockedStage === st;
                const isPassed = ctrl.enabled && idx < curIdx;
                return `
                  <button onclick="unlockTeacherStage('${teacherClassView}', '${st}')"
                    class="px-2.5 py-1.5 rounded-xl border-2 border-[#3a261f] text-[11px] font-black ${isCur ? 'bg-[#3a261f] text-[#ffd166]' : (isPassed ? 'bg-[#d1fae5] text-[#065f46]' : 'bg-white text-[#5c3d32]')}">
                    ${idx === 0 ? '🚪 대기실' : STAGE_LABELS[st].split(' (')[0]}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="cozy-panel p-3.5 bg-white text-center"><div class="text-xs font-black text-[#6b4f45]">총 접속 학생</div><div class="font-game text-3xl mt-1">${sorted.length}명</div></div>
            <div class="cozy-panel p-3.5 bg-[#fef3c7] text-center"><div class="text-xs font-black text-[#92400e]">🚪 출석 대기실</div><div class="font-game text-3xl text-[#d97706] mt-1">${lobbyCnt}명</div></div>
            <div class="cozy-panel p-3.5 bg-[#dbeafe] text-center"><div class="text-xs font-black text-[#1e40af]">🎮 현재 활동 중</div><div class="font-game text-3xl text-[#1d4ed8] mt-1">${activeCnt}명</div></div>
            <div class="cozy-panel p-3.5 bg-[#d1fae5] text-center"><div class="text-xs font-black text-[#065f46]">✅ 완료 · 다음 대기</div><div class="font-game text-3xl text-[#059669] mt-1">${waitCnt}명</div></div>
          </div>

          <div class="cozy-card p-5 bg-[#fffdf7]">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2 flex-wrap">
                <h3 class="font-game text-2xl">👀 ${teacherClassView}반 학생 실시간 활동 현황</h3>
                <div class="flex gap-1">
                  ${[
                    ['all', `전체 (${sorted.length})`],
                    ['lobby', `🚪 대기실 (${lobbyCnt})`],
                    ['active', `🎮 활동 중 (${activeCnt})`],
                    ['waiting', `✅ 완료·대기 (${waitCnt})`]
                  ].map(([fk, fl]) => `
                    <button onclick="monitorFilter='${fk}'; renderTeacher(document.getElementById('app-root'));"
                      class="px-2.5 py-1 rounded-lg border-2 border-[#3a261f] text-[11px] font-black ${monitorFilter === fk ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">${fl}</button>
                  `).join('')}
                </div>
              </div>
              <button onclick="pollFromSupabase(); renderTeacher(document.getElementById('app-root'));" class="btn-cozy px-3 py-1.5 rounded-xl bg-[#e0f2fe] text-xs font-black">🔄 새로고침</button>
            </div>

            ${filtered.length > 0 ? `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                ${filtered.map(r => {
                  const st = r.studentStatus || 'active';
                  const badge = st === 'lobby'
                    ? `<span class="px-2 py-0.5 rounded-full bg-[#fef3c7] text-[#92400e] border border-[#3a261f] text-[10px] font-black">🚪 출석 완료</span>`
                    : (st === 'waiting' || st === 'done')
                    ? `<span class="px-2 py-0.5 rounded-full bg-[#d1fae5] text-[#065f46] border border-[#3a261f] text-[10px] font-black">✅ 완료·대기</span>`
                    : `<span class="px-2 py-0.5 rounded-full bg-[#dbeafe] text-[#1e40af] border border-[#3a261f] text-[10px] font-black">🎮 활동 중</span>`;
                  const prog = Math.max(0, Math.min(100, Number(r.stageProgress || 0)));
                  return `
                    <div class="cozy-panel p-3 bg-white flex flex-col justify-between gap-2">
                      <div class="flex items-center justify-between gap-1">
                        <div class="font-black text-sm truncate">👤 ${escapeHtml(r.nickname)}</div>
                        ${badge}
                      </div>
                      <div class="text-xs font-extrabold text-[#1d4ed8] bg-[#f0f9ff] px-2.5 py-1.5 rounded-xl border border-[#bae6fd]">
                        ${escapeHtml(r.activityDetail || STAGE_LABELS[r.currentStage] || '활동 중')}
                      </div>
                      <div>
                        <div class="flex justify-between text-[10px] font-black text-[#6b4f45] mb-0.5">
                          <span>현재 단계 진행률</span><span>${prog}%</span>
                        </div>
                        <div class="w-full h-2 rounded-full bg-[#f1f5f9] border border-[#3a261f] overflow-hidden">
                          <div class="h-full ${st === 'waiting' || st === 'done' ? 'bg-[#10b981]' : 'bg-[#3b82f6]'}" style="width:${prog}%"></div>
                        </div>
                      </div>
                      <div class="flex items-center justify-between text-[11px] font-black text-[#5c3d32] pt-1 border-t border-dashed border-[#e2e8f0]">
                        <span>⭐ ${r.total || 0}점 · 🌍 ${r.eco ?? 70}</span>
                        <span class="text-[10px] font-bold text-[#94a3b8]">${formatAgo(r.updatedAt)}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `

    /* 교사 제어 액션들 */
    async function toggleTeacherControl(cls) {
      const c = getClassControl(cls);
      c.enabled = !c.enabled;
      await saveControl(cls);
      showToast(c.enabled ? `🔒 ${cls}반 단계 통제 ON` : `🔓 ${cls}반 단계 통제 OFF`, 'good');
      renderTeacher(document.getElementById('app-root'));
    }

    async function openLobbyForClass(cls) {
      const c = getClassControl(cls);
      c.enabled = true;
      c.paused = false;
      c.unlockedStage = 'lobby';
      await saveControl(cls);
      showToast(`🚪 ${cls}반 출석 대기실이 열렸습니다!`, 'good');
      renderTeacher(document.getElementById('app-root'));
    }

    async function advanceNextStageForClass(cls) {
      const c = getClassControl(cls);
      const curIdx = Math.max(0, STAGE_ORDER.indexOf(c.unlockedStage || 'lobby'));
      const nextSt = STAGE_ORDER[curIdx + 1];
      if (!nextSt) return;
      c.enabled = true;
      c.paused = false;
      c.unlockedStage = nextSt;
      await saveControl(cls);
      showToast(`🚀 ${cls}반 전원 [${STAGE_LABELS[nextSt]}] 단계로 이동!`, 'good');
      renderTeacher(document.getElementById('app-root'));
    }

    async function unlockTeacherStage(cls, st) {
      const c = getClassControl(cls);
      c.enabled = true;
      c.paused = false;
      c.unlockedStage = st;
      await saveControl(cls);
      showToast(`✅ ${cls}반 열린 단계: ${STAGE_LABELS[st]}`, 'good');
      renderTeacher(document.getElementById('app-root'));
    }

    async function toggleTeacherPause(cls) {
      const c = getClassControl(cls);
      c.paused = !c.paused;
      await saveControl(cls);
      showToast(c.paused ? `⏸️ ${cls}반 전체 일시정지!` : `▶️ ${cls}반 수업 재개!`, 'info');
      renderTeacher(document.getElementById('app-root'));
    }

    async function saveNoticeForClass(cls) {
      const inp = document.getElementById('ctrl-notice-input');
      getClassControl(cls).notice = inp ? inp.value.trim() : '';
      await saveControl(cls);
      showToast('공지 문구가 저장되었습니다!', 'good');
    }

    async function setS1TimerForClass(cls, sec) {
      getClassControl(cls).s1Timer = sec;
      await saveControl(cls);
      showToast(`STAGE 1 타이머가 ${sec === 0 ? '제한 없음' : sec + '초'}로 변경되었습니다.`, 'good');
      renderTeacher(document.getElementById('app-root'));
    }

    function changeTeacherPin() {
      const val = document.getElementById('new-pin-input').value.trim();
      if (val.length < 4) {
        showToast('비밀번호는 4자리 이상으로 입력해 주세요.', 'warn');
        return;
      }
      teacherPin = val;
      localStorage.setItem(STORAGE_KEY_PIN, teacherPin);
      showToast('교사 비밀번호가 변경되었습니다!', 'good');
    }

    function clearClassRanks(cls) {
      openConfirmModal(`${cls}반 기록을 초기화할까요?`, `${cls}반에 누적된 모든 학생 점수가 삭제됩니다.`, () => {
        liveRanks = liveRanks.filter(r => (r.classRoom || '1-1') !== cls);
        localStorage.setItem(STORAGE_KEY_RANKS, JSON.stringify(liveRanks));
        showToast(`${cls}반 기록이 초기화되었습니다.`, 'info');
        renderTeacher(document.getElementById('app-root'));
      });
    }

    async function saveSupaConfig() {
      const url = document.getElementById('supa-url').value.trim().replace(/\/$/, '');
      const key = document.getElementById('supa-key').value.trim();
      supaConfig = { url, key };
      localStorage.setItem(STORAGE_KEY_SUPA, JSON.stringify(supaConfig));
      if (!url || !key) {
        showToast('외부 서버 설정이 해제되었습니다.', 'info');
        renderTeacher(document.getElementById('app-root'));
        return;
      }
      try {
        const res = await fetch(`${url}/rest/v1/life_survival_ranks?select=student_key&limit=1`, {
          headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
        });
        if (res.ok) {
          showToast('✅ Supabase 실시간 서버 연결 성공!', 'good');
          pollFromSupabase();
        } else {
          showToast('⚠️ 연결은 되었으나 테이블 설정을 확인해 주세요.', 'warn');
        }
      } catch (e) {
        showToast('❌ 서버 연결에 실패했습니다. URL과 Key를 확인해 주세요.', 'bad');
      }
      renderTeacher(document.getElementById('app-root'));
    }

    /* 교사 시범 모드 */
    function startDemoMode(stage) {
      if (!isDemoMode) savedBeforeDemo = JSON.parse(JSON.stringify(state));
      isDemoMode = true;
      state = createInitialState();
      state.classRoom = teacherClassView;
      state.nickname = '교사 시범 예시';
      initStage1IfNeeded();
      initStage4IfNeeded();
      jumpDemoStage(stage);
    }

    function jumpDemoStage(stage) {
      const tip = document.getElementById('demo-tip-text');
      if (tip && STAGE_META[stage]) tip.textContent = `🎯 ${STAGE_META[stage].topic}`;
      goScreen(stage);
    }

    function exitDemoMode() {
      isDemoMode = false;
      if (savedBeforeDemo) {
        state = savedBeforeDemo;
        savedBeforeDemo = null;
      }
      goScreen('teacher');
    }

    /* 구글 시트 / 한셀 복사 및 CSV 다운로드 */
    function buildRowsForExport(cls) {
      const list = getClassRanks(cls).sort((a, b) => (a.classRoom || '').localeCompare(b.classRoom || '') || (b.total || 0) - (a.total || 0));
      const header = ['순위', '반', '학번·이름', '총점', 'ST1(자원감별)', 'ST2(마이룸)', 'ST3(자원순환)', 'ST4(시간관리)', 'ST5(에코타운)', '환경지수', '행복지수', '실천다짐'];
      const rows = list.map((r, i) => [
        i + 1, r.classRoom || '1-1', r.nickname || '', r.total || 0,
        r.s1 || 0, r.s2 || 0, r.s3 || 0, r.s4 || 0, r.s5 || 0,
        r.eco ?? 70, r.happy ?? 70, (r.pledge || '').replace(/\n/g, ' ')
      ]);
      return [header, ...rows];
    }

    function copySheetTSV(cls) {
      const data = buildRowsForExport(cls);
      const tsv = data.map(row => row.join('\t')).join('\n');
      copyTextWithFallback(tsv, '📋 복사 완료! 구글 시트·한셀 A1 셀에 Ctrl+V로 붙여넣으세요!');
    }

    function downloadCSV(cls) {
      const data = buildRowsForExport(cls);
      const csv = '\uFEFF' + data.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LIFE_SURVIVAL_${cls === 'ALL' ? '전체반' : cls + '반'}_결과.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📥 CSV 파일이 다운로드되었습니다!', 'good');
    }

    /* 반별 QR 모달 */
    function buildStudentShareUrl(cls) {
      const base = window.location.href.split('?')[0];
      const params = new URLSearchParams();
      params.set('class', cls);
      params.set('mode', 'student');
      if (supaConfig.url && supaConfig.key) {
        params.set('su', supaConfig.url);
        params.set('sk', supaConfig.key);
      }
      return `${base}?${params.toString()}`;
    }

    function openQrModal(cls) {
      const targetCls = cls || teacherClassView || '1-1';
      const btnWrap = document.getElementById('qr-class-buttons');
      btnWrap.innerHTML = CLASSES.map(c => `
        <button onclick="openQrModal('${c}')"
          class="px-2.5 py-1 rounded-xl border-2 border-[#3a261f] text-xs font-black ${c === targetCls ? 'bg-[#3a261f] text-[#ffd166]' : 'bg-white'}">${c}반</button>
      `).join('');

      const link = buildStudentShareUrl(targetCls);
      document.getElementById('qr-selected-class').textContent = `${targetCls}반`;
      document.getElementById('qr-link-input').value = link;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(link)}`;
      document.getElementById('qr-modal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qr-modal').classList.add('hidden');
    }

    /* =========================================================================
       16. 초기화 & 이벤트 리스너
    ========================================================================= */
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        syncChannel = new BroadcastChannel('life_survival_3d_sync_v4');
        syncChannel.onmessage = e => {
          const msg = e.data || {};
          if (msg.type === 'control' && msg.classRoom && msg.ctrl) {
            controlByClass[msg.classRoom] = Object.assign(createDefaultControl(), msg.ctrl);
            if (state.classRoom === msg.classRoom || state.screen === 'teacher') render();
          } else if (msg.type === 'rank' && msg.rec) {
            mergeLocalRankCache(msg.rec);
            if (['teacher', 'ranking', 'stage_rank', 'lobby'].includes(state.screen)) render();
          }
        };
      } catch (e) {}
    }

    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'T' || e.key === 't')) {
        e.preventDefault();
        openTeacherMode();
      }
    });

    setInterval(() => {
      if (supaConfig.url && supaConfig.key) {
        pollFromSupabase();
      }
    }, 5000);

    window.onload = function () {
      loadLocalStorageAll();
      loadUrlParams();
      updateLowSpecButton();
      render();
      if (supaConfig.url && supaConfig.key) pollFromSupabase();
    };
  </script>
</body>
</html>
