<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIFE SURVIVAL 3D - 24시간, 나의 자원을 지켜라!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (3D 시뮬레이션 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: Jua & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #3a261f;
      --cream: #fff9ef;
      --accent: #ff9f43;
      --mint: #52c498;
      --sky: #70d6ff;
      --coral: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at top left, #fff5e1 0%, #eafaf1 50%, #e0f2fe 100%);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
    }

    .font-game {
      font-family: 'Jua', sans-serif;
      letter-spacing: 0.02em;
    }

    .cozy-card {
      background: #fffdf8;
      border: 3px solid var(--ink);
      border-radius: 1.5rem;
      box-shadow: 0 6px 0 var(--ink);
    }

    .cozy-panel {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 1.15rem;
      box-shadow: 0 4px 0 var(--ink);
    }

    .btn-cozy {
      border: 2.5px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-cozy:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--ink);
    }
    .btn-cozy:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 1.5rem;
      overflow: hidden;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 65%, #dcfce7 100%);
      box-shadow: inset 0 0 24px rgba(58, 38, 31, 0.08);
    }

    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .canvas-wrap canvas:active { cursor: grabbing; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: floatSlow 2.6s ease-in-out infinite; }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: popIn 0.25s ease-out both; }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .cozy-card, .cozy-panel { box-shadow: none !important; }
    }
  </style>
</head>
<body class="pb-10">

  <!-- 교사 시범 모드 전용 상단 바 (시범 모드일 때만 표시) -->
  <div id="teacher-demo-bar" class="hidden no-print sticky top-0 z-50 bg-[#1d4ed8] text-white border-b-4 border-[#3a261f] px-4 py-2.5 shadow-lg">
    <div class="w-full max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 rounded-full bg-[#ffd166] text-[#3a261f] text-xs font-black">🖥️ 교사 시범 예시 화면</span>
        <span id="demo-tip-text" class="text-xs sm:text-sm font-bold text-[#dbeafe]">학생 랭킹에 기록되지 않는 시범 화면입니다.</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="jumpDemoStage('stage1')" class="px-2.5 py-1 rounded-lg bg-white text-[#1d4ed8] text-xs font-black hover:bg-[#dbeafe]">ST1</button>
        <button onclick="jumpDemoStage('stage2')" class="px-2.5 py-1 rounded-lg bg-white text-[#1d4ed8] text-xs font-black hover:bg-[#dbeafe]">ST2</button>
        <button onclick="jumpDemoStage('stage3')" class="px-2.5 py-1 rounded-lg bg-white text-[#1d4ed8] text-xs font-black hover:bg-[#dbeafe]">ST3</button>
        <button onclick="jumpDemoStage('stage4')" class="px-2.5 py-1 rounded-lg bg-white text-[#1d4ed8] text-xs font-black hover:bg-[#dbeafe]">ST4</button>
        <button onclick="jumpDemoStage('stage5')" class="px-2.5 py-1 rounded-lg bg-white text-[#1d4ed8] text-xs font-black hover:bg-[#dbeafe]">ST5</button>
        <button onclick="jumpDemoStage('final')" class="px-2.5 py-1 rounded-lg bg-[#ffd166] text-[#3a261f] text-xs font-black">최종 결과지</button>
        <button onclick="exitDemoMode()" class="px-3 py-1 rounded-lg bg-[#ef4444] text-white text-xs font-black ml-1">✖ 관제창 복귀</button>
      </div>
    </div>
  </div>

  <!-- 상단 HUD (전체 폭 확장) -->
  <header class="no-print sticky top-0 z-40 bg-[#fffdf7]/95 backdrop-blur border-b-4 border-[#3a261f] px-3 sm:px-6 py-2.5">
    <div class="w-full max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- 왼쪽: 비밀 교사 입장 트리거(아바타 5회 클릭) + 타이틀/학생 정보 -->
      <div class="flex items-center gap-2.5">
        <button id="secret-avatar-btn" onclick="handleSecretAvatarTap()" title="LIFE SURVIVAL 3D"
          class="w-11 h-11 rounded-2xl bg-[#ffd166] border-2 border-[#3a261f] flex items-center justify-center text-2xl shadow-[0_3px_0_#3a261f] active:translate-y-0.5 transition">
          😊
        </button>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-game text-xl sm:text-2xl leading-none text-[#3a261f]">LIFE SURVIVAL 3D</h1>
            <span id="hud-class-badge" class="hidden sm:inline-block px-2 py-0.5 rounded-full bg-[#3a261f] text-[#ffd166] text-[11px] font-black">1-1반</span>
          </div>
          <p id="hud-student-name" class="text-xs font-bold text-[#6b4f45] mt-0.5">24시간, 나의 자원을 지켜라!</p>
        </div>
      </div>

      <!-- 중앙: 4대 자원 HUD -->
      <div id="hud-stats" class="flex flex-wrap items-center gap-1.5 sm:gap-2.5">
        <div class="px-2.5 py-1 rounded-xl bg-[#fef3c7] border-2 border-[#3a261f] text-xs font-black">💰 <span id="stat-money">20,000</span>P</div>
        <div class="px-2.5 py-1 rounded-xl bg-[#e0f2fe] border-2 border-[#3a261f] text-xs font-black">⏰ <span id="stat-time">12</span>h</div>
        <div class="px-2.5 py-1 rounded-xl bg-[#fce7f3] border-2 border-[#3a261f] text-xs font-black">⚡ <span id="stat-health">80</span></div>
        <div class="px-2.5 py-1 rounded-xl bg-[#dcfce7] border-2 border-[#3a261f] text-xs font-black">🌍 <span id="stat-eco">70</span></div>
        <div class="px-2.5 py-1 rounded-xl bg-[#ede9fe] border-2 border-[#3a261f] text-xs font-black">💖 <span id="stat-happy">70</span></div>
        <div class="px-2.5 py-1 rounded-xl bg-[#3a261f] text-[#ffd166] text-xs font-black">⭐ <span id="stat-score">0</span>점</div>
      </div>

      <!-- 오른쪽: 홈으로 + 저사양 모드 토글 + 교사 인증 시에만 표시되는 교사 버튼 -->
      <div class="flex items-center gap-1.5">
        <button id="btn-go-home" onclick="confirmGoHome()" title="홈 화면으로 돌아가기"
          class="hidden btn-cozy px-2.5 py-1.5 rounded-xl bg-[#fff4dc] text-xs font-black">
          🏠 홈으로
        </button>
        <button id="btn-low-spec" onclick="toggleLowSpecMode()" title="저사양 3D 경량화 모드"
          class="btn-cozy px-2.5 py-1.5 rounded-xl bg-white text-xs font-black">
          ⚡ 일반화질
        </button>
        <button id="btn-teacher-mode" onclick="openTeacherMode()"
          class="hidden btn-cozy px-3 py-1.5 rounded-xl bg-[#3a261f] text-[#ffd166] text-xs font-black">
          👩‍🏫 교사 관제창
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 앱 컨테이너 (화면 전체 폭 사용) -->
  <main id="app-root" class="w-full max-w-[1600px] mx-auto px-3 sm:px-6 pt-4"></main>

  <!-- 토스트 메시지 영역 -->
  <div id="toast-container" class="no-print fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- 교사 비밀번호 인증 모달 -->
  <div id="pin-modal" class="hidden no-print fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cozy-card p-6 w-full max-w-sm bg-[#fffdf7] animate-pop">
      <div class="text-center mb-4">
        <div class="text-4xl mb-1">🔐</div>
        <h3 class="font-game text-2xl text-[#3a261f]">교사 전용 관제 모드</h3>
        <p class="text-xs font-bold text-[#6b4f45] mt-1">선생님 비밀번호(PIN)를 입력해 주세요.</p>
      </div>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="10" placeholder="비밀번호 입력"
        onkeydown="if(event.key==='Enter') submitTeacherPin()"
        class="w-full px-4 py-3 rounded-2xl border-2 border-[#3a261f] text-center font-black text-lg tracking-widest mb-3 focus:outline-none focus:ring-2 focus:ring-[#ff9f43]" />
      <p id="pin-error" class="hidden text-xs font-black text-[#dc2626] text-center mb-3">비밀번호가 일치하지 않습니다.</p>
      <div class="flex gap-2">
        <button onclick="closePinModal()" class="btn-cozy flex-1 py-2.5 rounded-xl bg-white font-black text-sm">취소</button>
        <button onclick="submitTeacherPin()" class="btn-cozy flex-1 py-2.5 rounded-xl bg-[#52c498] font-black text-sm">입장하기</button>
      </div>
    </div>
  </div>

  <!-- 반별 학생 QR 코드 모달 -->
  <div id="qr-modal" class="hidden no-print fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cozy-card p-6 w-full max-w-lg bg-[#fffdf7] animate-pop text-center">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-game text-2xl text-[#3a261f]">📱 학생 접속용 QR 코드</h3>
        <button onclick="closeQrModal()" class="btn-cozy px-3 py-1 rounded-xl bg-[#fda4af] text-xs font-black">닫기 ✖</button>
      </div>
      <div class="flex flex-wrap justify-center gap-1.5 mb-4" id="qr-class-buttons"></div>
      <div class="p-4 rounded-2xl bg-white border-2 border-[#3a261f] inline-block mb-3">
        <img id="qr-image" src="" alt="학생 접속 QR 코드" class="w-56 h-56 mx-auto rounded-lg"
          onerror="this.onerror=null; this.src='https://placehold.co/240x240/fff4dc/3a261f?text=QR+Link+Ready';" />
      </div>
      <div class="text-xs font-black text-[#065f46] bg-[#dcfce7] px-3 py-2 rounded-xl border border-[#3a261f] mb-3">
        선택된 반: <span id="qr-selected-class">1-1반</span> (학생 전용 링크 · 교사 메뉴 자동 숨김)
      </div>
      <div class="flex gap-2">
        <input id="qr-link-input" readonly class="flex-1 px-3 py-2 rounded-xl border-2 border-[#3a261f] bg-[#f8fafc] text-xs font-bold" />
        <button onclick="copyTextWithFallback(document.getElementById('qr-link-input').value, '학생 배포 링크가 복사되었습니다!')"
          class="btn-cozy px-4 py-2 rounded-xl bg-[#ffd166] text-xs font-black">복사</button>
      </div>
    </div>
  </div>

  <!-- 커스텀 확인 모달 (confirm() 대체) -->
  <div id="confirm-modal" class="hidden no-print fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cozy-card p-6 w-full max-w-sm bg-[#fffdf7] animate-pop text-center">
      <div class="text-4xl mb-2">⚠️</div>
      <h3 id="confirm-title" class="font-game text-2xl text-[#3a261f]">확인해 주세요</h3>
      <p id="confirm-desc" class="text-sm font-bold text-[#5c3d32] mt-2 mb-5"></p>
      <div class="flex gap-2">
        <button onclick="closeConfirmModal(false)" class="btn-cozy flex-1 py-2.5 rounded-xl bg-white font-black text-sm">취소</button>
        <button onclick="closeConfirmModal(true)" class="btn-cozy flex-1 py-2.5 rounded-xl bg-[#ff6b6b] text-white font-black text-sm">확인</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. 핵심 상수 및 교육 콘텐츠 데이터
    ========================================================================= */
    const CLASSES = ['1-1', '1-2', '1-3', '1-4', '1-5', '1-6', '1-7', '1-8'];
    const STAGE_ORDER = ['lobby', 'stage1', 'stage2', 'stage3', 'session1_end', 'stage4', 'stage5', 'final', 'ranking'];
    const STAGE_LABELS = {
      start: '입장 준비',

    const STAGE_META = {

        takeaway: '시간·체력·지식·재능은 "인적자원", 용돈·옷·스마트폰·도서관은 "물적자원"입니다. 두 자원은 서로 보완하며 쓰입니다!',

        takeaway: '자원은 한정되어 있어 하나를 아끼면 다른 자원이 쓰입니다(대체성). 상황에 맞춰 균형 있게 조절하는 것이 핵심입니다!',
        nextPreview: 'STAGE 3 · 물건의 생애를 따라가며 5R 자원 순환 우선순위를 체험합니다.'

      stage3: {
        topic: '지속가능한 자원 순환과 5R 우선순위',

        takeaway: '시험 공부·운동·독서 같은 2사분면 활동을 미리 챙기면 1사분면 위기가 줄어들고, 4사분면(무의미한 쇼츠)의 유혹을 이길 수 있습니다!',
        nextPreview: 'STAGE 5 · 3D 에코 타운에서 나와 지구를 함께 살리는 지속가능한 소비를 실천합니다.'

      stage5: {

        takeaway: '나 혼자 편한 선택보다 우리 모두가 오래 살 수 있는 "지속가능한 소비"가 결국 나의 행복과 건강으로 돌아옵니다!',
        nextPreview: '최종 성적표 · 나의 자원관리 유형을 확인하고 If-Then 실천 다짐을 작성합니다.'
      }
    };

    const STAGE1_CARDS = [
      { id: 1, name: '요리 실력과 레시피 지식', icon: '👨‍🍳', type: 'human', desc: '사람이 배우고 익혀 몸에 지닌 기술·지식은 인적자원입니다.' },
      { id: 2, name: '이번 달 용돈 30,000원', icon: '💵', type: 'material', desc: '화폐(돈)는 대표적인 경제적 물적자원입니다.' },
      { id: 3, name: '건강한 체력과 지구력', icon: '💪', type: 'human', desc: '건강과 체력은 사람 내부에 존재하는 소중한 인적자원입니다.' },
      { id: 4, name: '우리 동네 공공도서관', icon: '🏛️', type: 'material', desc: '지역사회 시설과 공간은 함께 쓰는 물적자원입니다.' },
      { id: 5, name: '하루 24시간이라는 시간', icon: '⏰', type: 'human', desc: '시간은 누구에게나 공평하게 주어지는 핵심 인적자원입니다.' },

    function escapeHtml(str) {

      }[m]));

    function showToast(msg, type = 'info') {
      const wrap = document.getElementById('toast-container');
      if (!wrap) return;
      const colors = {
        good: 'bg-[#dcfce7] text-[#065f46]',
        warn: 'bg-[#fef3c7] text-[#92400e]',
        bad: 'bg-[#fee2e2] text-[#991b1b]',
        info: 'bg-[#e0f2fe] text-[#1e3a8a]'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border-2 border-[#3a261f] shadow-[0_4px_0_#3a261f] text-xs sm:text-sm font-black animate-pop ${colors[type] || colors.info}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function copyTextWithFallback(text, successMsg = '복사되었습니다!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg, 'good');
          return true;
        }
      } catch (e) {}
      showToast('복사에 실패했습니다. 직접 선택해 복사해 주세요.', 'warn');

        if (rawState) {
          const parsed = JSON.parse(rawState);
          state = Object.assign(createInitialState(), parsed);
        }
      } catch (e) {}
    }

    function loadUrlParams() {
      try {
        const params = new URLSearchParams(window.location.search);
        const cls = params.get('class');
        if (cls && CLASSES.includes(cls)) {
          state.classRoom = cls;
          rankingClassView = cls;
          teacherClassView = cls;
        }
        const su = params.get('su');
        const sk = params.get('sk');
        if (su && sk) {
          supaConfig = { url: su, key: sk };
          localStorage.setItem(STORAGE_KEY_SUPA, JSON.stringify(supaConfig));
        }
        if (params.get('mode') === 'teacher') {
          setTimeout(() => openTeacherMode(), 300);
        }
      } catch (e) {}
    }

    function mergeLocalRankCache(rec) {
      if (!rec || !rec.nickname) return;
      const cls = rec.classRoom || '1-1';
      const idx = liveRanks.findIndex(r => (r.classRoom || '1-1') === cls && r.nickname === rec.nickname);
      if (idx >= 0) {
        liveRanks[idx] = Object.assign({}, liveRanks[idx], rec, {
          cheers: Math.max(liveRanks[idx].cheers || 0, rec.cheers || 0)
        });
      } else {
        liveRanks.push(rec);
      }
      try { localStorage.setItem(STORAGE_KEY_RANKS, JSON.stringify(liveRanks)); } catch (e) {}
    }

    function isStageLockedForStudent(screen) {
      if (isTeacherAuthed || isDemoMode) return false;
      const ctrl = getClassControl(state.classRoom);
      if (!ctrl.enabled) return false;
      if (['start', 'lobby', 'stage_rank', 'teacher'].includes(screen)) return false;
      const curIdx = STAGE_ORDER.indexOf(screen);
      const unlockedIdx = STAGE_ORDER.indexOf(ctrl.unlockedStage || 'lobby');
      if (curIdx < 0) return false;
      return curIdx > unlockedIdx;
    }

    function getStudentActivityInfo() {
      const scr = state.screen || 'start';
      const locked = isStageLockedForStudent(scr);
      if (scr === 'lobby') return { detail: '🚪 출석 완료 · 시작 대기 중', progress: 0, status: 'lobby' };
      if (locked) return { detail: `☕ ${STAGE_LABELS[scr] || '다음 단계'} 대기 중`, progress: 100, status: 'waiting' };
      if (scr === 'stage1') {
        const total = (state.s1.deck && state.s1.deck.length) || 10;
        const done = state.s1.done ? total : state.s1.index;
        return {
          detail: state.s1.done ? '✅ STAGE 1 완료' : `🏭 STAGE 1 · ${Math.min(done + 1, total)}/${total}번 분류 중`,
          progress: Math.round((done / total) * 100),
          status: state.s1.done ? 'waiting' : 'active'
        };
      }
      if (scr === 'stage2') {
        const total = STAGE2_SPOTS.length;
        const done = state.s2.completedIds.length;
        return {
          detail: done >= total ? '✅ STAGE 2 완료' : `🏠 STAGE 2 · 마이룸 탐험 (${done}/${total} 완료)`,
          progress: Math.round((done / total) * 100),
          status: done >= total ? 'waiting' : 'active'
        };
      }
      if (scr === 'stage3') {
        const total = STAGE3_ITEMS.length;
        const done = state.s3.done ? total : state.s3.index;
        return {
          detail: state.s3.done ? '✅ STAGE 3 완료' : `♻️ STAGE 3 · 순환 공방 (${Math.min(done + 1, total)}/${total})`,
          progress: Math.round((done / total) * 100),
          status: state.s3.done ? 'waiting' : 'active'
        };
      }
      if (scr === 'session1_end') return { detail: '🎉 1차시 리포트 확인 중', progress: 100, status: 'waiting' };
      if (scr === 'stage4') {
        const placed = Object.keys(state.s4.placements || {}).length;
        return {
          detail: state.s4.analyzed ? '✅ STAGE 4 분석 완료' : `⏰ STAGE 4 · 코비 매트릭스 (${placed}/12 배치)`,
          progress: Math.round((placed / 12) * 100),
          status: state.s4.analyzed ? 'waiting' : 'active'
        };
      }
      if (scr === 'stage5') {
        const done = state.s5.doneIds.length;
        return {
          detail: done >= 5 ? '✅ STAGE 5 완료' : `🌍 STAGE 5 · 에코 타운 (${done}/5 완료)`,
          progress: Math.round((done / 5) * 100),
          status: done >= 5 ? 'waiting' : 'active'
        };
      }
      if (scr === 'stage_rank') return { detail: '🏆 중간 랭킹 확인 중', progress: 100, status: 'waiting' };
      if (scr === 'final') return { detail: '📝 최종 결과지 & 다짐 작성 중', progress: 95, status: 'active' };
      if (scr === 'ranking') return { detail: '👑 전체 활동 완료 · 랭킹 확인', progress: 100, status: 'done' };
      return { detail: STAGE_LABELS[scr] || '활동 중', progress: 0, status: 'active' };
    }

    async function submitRecordToRanking(showNotice = false) {
      if (isDemoMode || !state.nickname) return;
      const sc = calcTotalScore();
      const info = getLifestyleProfile();
      const act = getStudentActivityInfo();
      const pledgeText = (state.pledge.when || state.pledge.action)
        ? `[${state.pledge.when || '일상에서'}] ${state.pledge.instead ? state.pledge.instead + ' 대신 ' : ''}${state.pledge.action || '실천하겠다!'}`
        : '';

      const rec = {
        runId: state.runId,
        classRoom: state.classRoom || '1-1',
        nickname: state.nickname.trim(),
        currentStage: state.screen || 'stage1',
        activityDetail: act.detail,
        stageProgress: act.progress,
        studentStatus: act.status,
        title: info.title,
        total: sc.total,
        s1: sc.s1, s2: sc.s2, s3: sc.s3, s4: sc.s4, s5: sc.s5,
        happyBonus: sc.happyBonus,
        eco: state.eco, happy: state.happy, money: state.money, health: state.health,
        pledge: pledgeText,
        cheers: 0,
        updatedAt: Date.now()
      };

      mergeLocalRankCache(rec);

      if (syncChannel) {
        try { syncChannel.postMessage({ type: 'rank', rec }); } catch (e) {}
      }

      if (supaConfig.url && supaConfig.key) {
        try {
          const studentKey = `${rec.classRoom}__${rec.nickname}`;
          await fetch(`${supaConfig.url}/rest/v1/life_survival_ranks?on_conflict=student_key`, {
            method: 'POST',
            headers: {
              'apikey': supaConfig.key,
              'Authorization': `Bearer ${supaConfig.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify({
              student_key: studentKey,
              run_id: rec.runId,
              class_room: rec.classRoom,
              nickname: rec.nickname,
              current_stage: rec.activityDetail,
              title: rec.title,
              total: rec.total,
              s1: rec.s1, s2: rec.s2, s3: rec.s3, s4: rec.s4, s5: rec.s5,
              eco: rec.eco, happy: rec.happy,
              pledge: rec.pledge
            })
          });
        } catch (e) {}
      }

      if (showNotice) showToast('우리 반 기록에 저장되었습니다!', 'good');
    }

    function scheduleLiveSync() {
      if (isDemoMode || isTeacherAuthed || !state.nickname || state.screen === 'start' || state.screen === 'teacher') return;
      const act = getStudentActivityInfo();
      const sc = calcTotalScore();
      const sig = `${state.screen}|${act.detail}|${act.progress}|${sc.total}|${state.eco}`;
      if (sig === lastLiveSyncPayload) return;
      clearTimeout(liveSyncTimer);
      liveSyncTimer = setTimeout(() => {
        lastLiveSyncPayload = sig;
        submitRecordToRanking(false);
      }, 600);
    }

    async function saveControl(cls) {
      try { localStorage.setItem(STORAGE_KEY_CTRL, JSON.stringify(controlByClass)); } catch (e) {}
      if (syncChannel) {
        try { syncChannel.postMessage({ type: 'control', classRoom: cls, ctrl: controlByClass[cls] }); } catch (e) {}
      }
      if (supaConfig.url && supaConfig.key) {
        try {
          await fetch(`${supaConfig.url}/rest/v1/life_survival_control?on_conflict=class_room`, {
            method: 'POST',
            headers: {
              'apikey': supaConfig.key,
              'Authorization': `Bearer ${supaConfig.key}`,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify({
              class_room: cls,
              enabled: controlByClass[cls].enabled,
              unlocked_stage: controlByClass[cls].unlockedStage,
              paused: controlByClass[cls].paused,
              notice: controlByClass[cls].notice,
              s1_timer: controlByClass[cls].s1Timer
            })
          });
        } catch (e) {}
      }
    }

    async function pollFromSupabase() {
      if (!supaConfig.url || !supaConfig.key) return;
      try {
        const resC = await fetch(`${supaConfig.url}/rest/v1/life_survival_control?select=*`, {
          headers: { 'apikey': supaConfig.key, 'Authorization': `Bearer ${supaConfig.key}` }
        });
        if (resC.ok) {
          const rows = await resC.json();
          let changed = false;
          rows.forEach(r => {
            const cls = r.class_room;
            if (!CLASSES.includes(cls)) return;
            const prev = JSON.stringify(controlByClass[cls]);
            controlByClass[cls] = {
              enabled: !!r.enabled,
              unlockedStage: r.unlocked_stage || 'lobby',
              paused: !!r.paused,
              notice: r.notice || '',
              s1Timer: typeof r.s1_timer === 'number' ? r.s1_timer : 5
            };
            if (prev !== JSON.stringify(controlByClass[cls])) changed = true;
          });
          if (changed) {
            localStorage.setItem(STORAGE_KEY_CTRL, JSON.stringify(controlByClass));
            if (state.screen !== 'teacher') render();
          }
        }
      } catch (e) {}

      try {
        const resR = await fetch(`${supaConfig.url}/rest/v1/life_survival_ranks?select=*&order=total.desc`, {
          headers: { 'apikey': supaConfig.key, 'Authorization': `Bearer ${supaConfig.key}` }
        });
        if (resR.ok) {
          const rows = await resR.json();
          rows.forEach(r => {
            const detail = r.current_stage || '활동 중';
            mergeLocalRankCache({
              runId: r.run_id || r.student_key,
              classRoom: r.class_room || '1-1',
              nickname: r.nickname,
              currentStage: detail.includes('출석') ? 'lobby' : 'active',
              activityDetail: detail,
              stageProgress: detail.includes('완료') ? 100 : (r.total > 0 ? Math.min(95, Math.round(r.total / 9)) : 10),
              studentStatus: detail.includes('출석') ? 'lobby' : (detail.includes('완료') || detail.includes('대기') ? 'waiting' : 'active'),
              title: r.title || '',
              total: r.total || 0,
              s1: r.s1 || 0, s2: r.s2 || 0, s3: r.s3 || 0, s4: r.s4 || 0, s5: r.s5 || 0,
              eco: r.eco ?? 70, happy: r.happy ?? 70,
              pledge: r.pledge || '',
              updatedAt: r.updated_at ? new Date(r.updated_at).getTime() : Date.now()
            });
          });
          if (['teacher', 'ranking', 'stage_rank', 'lobby'].includes(state.screen)) {
            render();
          }
        }
      } catch (e) {}
    }

    function getClassRanks(cls) {
      if (cls === 'ALL') return [...liveRanks];
      return liveRanks.filter(r => (r.classRoom || '1-1') === cls);
    }

    /* =========================================================================
       4. Three.js 3D 시뮬레이션 엔진 (메모리 누수 ZERO + 마우스/터치 회전)
    ========================================================================= */
    function destroy3D() {
      if (threeCtx.animId) {
        cancelAnimationFrame(threeCtx.animId);
        threeCtx.animId = null;
      }
      threeCtx.cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
      threeCtx.cleanupFns = [];
      if (threeCtx.scene) {
        threeCtx.scene.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
        threeCtx.scene = null;
      }
      if (threeCtx.renderer) {
        try {
          threeCtx.renderer.dispose();
          if (threeCtx.renderer.domElement && threeCtx.renderer.domElement.parentNode) {
            threeCtx.renderer.domElement.parentNode.removeChild(threeCtx.renderer.domElement);
          }
        } catch (e) {}
        threeCtx.renderer = null;
      }
      threeCtx.camera = null;
    }

    function mount3DScene(containerId, buildFn) {
      destroy3D();
      const container = document.getElementById(containerId);
      if (!container || typeof THREE === 'undefined') return;

      const w = container.clientWidth || 640;
      const h = container.clientHeight || 300;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
      camera.position.set(0, 5.2, 8.2);
      camera.lookAt(0, 0.5, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: !lowSpecMode, alpha: true });
      renderer.setPixelRatio(lowSpecMode ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(w, h);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      // 기본 조명
      const amb = new THREE.AmbientLight(0xffffff, 0.78);
      scene.add(amb);
      const dir = new THREE.DirectionalLight(0xfffbeb, 0.85);
      dir.position.set(6, 10, 7);
      scene.add(dir);

      const rootGroup = new THREE.Group();
      scene.add(rootGroup);

      // 마우스 & 터치 드래그로 카메라 회전
      let dragging = false;
      let prevX = 0;
      let targetRotY = 0;
      const onDown = e => {
        dragging = true;
        prevX = e.touches ? e.touches[0].clientX : e.clientX;
      };
      const onMove = e => {
        if (!dragging) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        targetRotY += (cx - prevX) * 0.008;
        prevX = cx;
      };
      const onUp = () => { dragging = false; };

      const dom = renderer.domElement;
      dom.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      dom.addEventListener('touchstart', onDown, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onUp);

      const onResize = () => {
        if (!container || !threeCtx.renderer) return;
        const nw = container.clientWidth || 640;
        const nh = container.clientHeight || 300;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      };
      window.addEventListener('resize', onResize);

      threeCtx.renderer = renderer;
      threeCtx.scene = scene;
      threeCtx.camera = camera;
      threeCtx.cleanupFns.push(() => {
        dom.removeEventListener('mousedown', onDown);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        dom.removeEventListener('touchstart', onDown);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
        window.removeEventListener('resize', onResize);
      });

      const onTick = buildFn({ scene, camera, rootGroup, renderer }) || (() => {});
      let lastFrame = 0;
      function animate(now) {
        threeCtx.animId = requestAnimationFrame(animate);
        if (lowSpecMode && now - lastFrame < 33) return;
        lastFrame = now;
        if (!dragging) targetRotY += 0.0025;
        rootGroup.rotation.y += (targetRotY - rootGroup.rotation.y) * 0.08;
        onTick(now * 0.001);
        renderer.render(scene, camera);
      }
      threeCtx.animId = requestAnimationFrame(animate);
    }

    function buildStartIsland3D({ rootGroup }) {
      // 떠 있는 에코 아일랜드
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(3.2, 2.4, 0.8, 12),
        new THREE.MeshStandardMaterial({ color: 0x86efac, flatShading: true })
      );
      base.position.y = -0.2;
      rootGroup.add(base);

      // 아기자기한 집
      const house = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 1.3, 1.5),
        new THREE.MeshStandardMaterial({ color: 0xfffbeb })
      );
      house.position.set(-0.6, 0.85, -0.3);
      rootGroup.add(house);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(1.4, 0.9, 4),
        new THREE.MeshStandardMaterial({ color: 0xff6b6b })
      );
      roof.position.set(-0.6, 1.95, -0.3);
      roof.rotation.y = Math.PI / 4;
      rootGroup.add(roof);

      // 태양광 패널
      const panel = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.08, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x1d4ed8 })
      );
      panel.position.set(-0.15, 1.8, 0.2);
      panel.rotation.x = 0.55;
      rootGroup.add(panel);

      // 나무 3그루
      [[1.5, 0.4, 0.8], [1.7, 0.4, -0.9], [-1.9, 0.4, 1.0]].forEach(([x, y, z]) => {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.18, 0.7, 6),
          new THREE.MeshStandardMaterial({ color: 0x92400e })
        );
        trunk.position.set(x, y, z);
        const leaf = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.55),
          new THREE.MeshStandardMaterial({ color: 0x10b981, flatShading: true })
        );
        leaf.position.set(x, y + 0.65, z);
        rootGroup.add(trunk, leaf);
      });

      // 떠다니는 구름
      const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 10, 10),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
      );
      cloud.position.set(1.4, 2.5, -0.5);
      rootGroup.add(cloud);

      return t => {
        rootGroup.position.y = Math.sin(t * 1.5) * 0.12;
        cloud.position.x = 1.4 + Math.sin(t) * 0.3;
      };
    }

    function buildStage1Factory3D({ rootGroup, camera }) {
      camera.position.set(0, 4.2, 7.2);
      // 컨베이어 벨트
      const belt = new THREE.Mesh(
        new THREE.BoxGeometry(7.2, 0.35, 1.8),
        new THREE.MeshStandardMaterial({ color: 0x475569 })
      );
      belt.position.y = 0;
      rootGroup.add(belt);

      // 왼쪽(인적자원) & 오른쪽(물적자원) 게이트
      const leftGate = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 2.0, 2.2),
        new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
      );
      leftGate.position.set(-3.3, 1.0, 0);
      const rightGate = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 2.0, 2.2),
        new THREE.MeshStandardMaterial({ color: 0xf59e0b })
      );
      rightGate.position.set(3.3, 1.0, 0);
      rootGroup.add(leftGate, rightGate);

      // 중앙 자원 큐브
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(1.15, 1.15, 1.15),
        new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.35 })
      );
      box.position.set(0, 0.9, 0);
      rootGroup.add(box);

      return t => {
        box.rotation.y = t * 1.4;
        box.position.y = 0.95 + Math.abs(Math.sin(t * 2.6)) * 0.25;
      };

    function buildStage2Room3D({ rootGroup, camera }) {
      camera.position.set(0, 6.2, 7.8);
      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(6.8, 0.3, 5.6),
        new THREE.MeshStandardMaterial({ color: 0xfde68a })
      );
      rootGroup.add(floor);

      const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(6.8, 2.4, 0.2),
        new THREE.MeshStandardMaterial({ color: 0xfffbeb })
      );
      backWall.position.set(0, 1.2, -2.7);
      rootGroup.add(backWall);

      const markers = [];
      STAGE2_SPOTS.forEach(sp => {
        const done = state.s2.completedIds.includes(sp.id);
        const isActive = state.s2.activeSpotId === sp.id;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.95, 0.95),
          new THREE.MeshStandardMaterial({
            color: done ? 0x10b981 : sp.color,
            emissive: isActive ? 0x333333 : 0x000000
          })
        );
        mesh.position.set(sp.pos[0], sp.pos[1], sp.pos[2]);
        rootGroup.add(mesh);
        markers.push({ mesh, baseY: sp.pos[1], isActive, done });
      });

      return t => {
        markers.forEach((m, i) => {
          m.mesh.position.y = m.baseY + (m.isActive ? Math.sin(t * 5) * 0.22 : Math.sin(t * 2 + i) * 0.06);
          if (m.done) m.mesh.rotation.y = t * 0.8;
        });
      };
    }

    function buildStage3Workshop3D({ rootGroup, camera }) {
      camera.position.set(0, 4.0, 6.8);
      const table = new THREE.Mesh(
        new THREE.CylinderGeometry(2.6, 2.8, 0.4, 16),
        new THREE.MeshStandardMaterial({ color: 0xd97706 })
      );
      rootGroup.add(table);

      const item = STAGE3_ITEMS[state.s3.index] || STAGE3_ITEMS[0];
      const obj = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.95, 0),
        new THREE.MeshStandardMaterial({ color: item.color, flatShading: true })
      );

      rootGroup.add(obj);

      const ring = new THREE.Mesh(

        new THREE.MeshStandardMaterial({ color: 0x10b981 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.5;
      rootGroup.add(ring);

      return t => {
        obj.rotation.y = t * 1.2;
        obj.rotation.x = Math.sin(t) * 0.25;
        ring.rotation.z = t * 0.7;
      };
    }

    function buildStage5EcoTown3D({ rootGroup, camera }) {
      camera.position.set(0, 5.8, 8.6);
      const ecoRatio = Math.max(0, Math.min(1, state.eco / 100));
      const groundColor = ecoRatio > 0.65 ? 0x4ade80 : (ecoRatio > 0.4 ? 0xfacc15 : 0x9ca3af);
      const ground = new THREE.Mesh(
        new THREE.CylinderGeometry(3.8, 3.5, 0.5, 18),
        new THREE.MeshStandardMaterial({ color: groundColor })
      );
      rootGroup.add(ground);

      // 건물 3채 + 태양광
      [[-1.6, 0.9, -0.8, 0xfffbeb], [0.2, 1.2, -1.3, 0xe0f2fe], [1.7, 0.8, -0.5, 0xfef3c7]].forEach(([x, h, z, c]) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, h, 1.1), new THREE.MeshStandardMaterial({ color: c }));
        b.position.set(x, h / 2 + 0.25, z);
        rootGroup.add(b);
      });

      // 환경 지수에 따라 나무 개수 증가!
      const treeCount = Math.max(2, Math.round(ecoRatio * 9));
      for (let i = 0; i < treeCount; i++) {
        const ang = (i / treeCount) * Math.PI * 2;
        const r = 2.6;
        const tx = Math.cos(ang) * r;
        const tz = Math.sin(ang) * r;
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0x78350f }));
        tr.position.set(tx, 0.5, tz);
        const lf = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.95, 7), new THREE.MeshStandardMaterial({ color: 0x059669 }));
        lf.position.set(tx, 1.1, tz);
        rootGroup.add(tr, lf);
      }

      // 풍력 발전기
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.4, 8), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
      pole.position.set(0, 1.4, 1.2);
      rootGroup.add(pole);
      const blades = new THREE.Group();
      blades.position.set(0, 2.5, 1.32);
      for (let i = 0; i < 3; i++) {
        const bl = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.04), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
        bl.position.y = 0.45;
        const pivot = new THREE.Group();
        pivot.rotation.z = (i * Math.PI * 2) / 3;
        pivot.add(bl);
        blades.add(pivot);
      }
      rootGroup.add(blades);

      return t => {
        blades.rotation.z = -t * (1.2 + ecoRatio * 2.5);
      };
    }

    async function startGameFlow(mode) {
      const inp = document.getElementById('input-nickname');
      const name = inp ? inp.value.trim() : state.nickname.trim();
      if (!name) {
        showToast('학번과 실명을 입력해 주세요! (예: 10305 김가정)', 'warn');
        if (inp) inp.focus();
        return;
      }
      state.nickname = name;
      rankingClassView = state.classRoom;
      const targetStage = mode === 'session1' ? 'stage1' : 'stage4';
      const ctrl = getClassControl(state.classRoom);

      if (ctrl.enabled && ctrl.unlockedStage === 'lobby' && !isDemoMode) {
        state.pendingStage = targetStage;
        state.screen = 'lobby';
      } else {
        if (mode === 'session1') {
          initStage1IfNeeded();
          state.screen = 'stage1';
        } else {
          initStage4IfNeeded();
          state.screen = 'stage4';
        }
      }
      await submitRecordToRanking(false);
      goScreen(state.screen);
    }

       7. STAGE 1: 3D 자원 감별 공장
    ========================================================================= */
    function initStage1IfNeeded() {
      if (!state.s1.deck || state.s1.deck.length === 0) {
        state.s1.deck = [...STAGE1_CARDS].sort(() => Math.random() - 0.5);
        state.s1.index = 0;
        state.s1.score = 0;
        state.s1.wrongs = [];
        state.s1.done = false;
        state.s1.lastFeedback = null;
      }
    }

    function startS1Timer() {
      clearTimers();
      const limit = getClassControl(state.classRoom).s1Timer;
      if (!limit || limit <= 0 || state.s1.done || state.s1.lastFeedback) return;
      s1TimeLeft = limit;
      const el = document.getElementById('s1-timer-text');
      if (el) el.textContent = `${s1TimeLeft}초`;
      s1Interval = setInterval(() => {
        s1TimeLeft--;
        const tEl = document.getElementById('s1-timer-text');
        if (tEl) tEl.textContent = `${s1TimeLeft}초`;
        if (s1TimeLeft <= 0) {
          clearTimers();
          answerStage1('timeout');
        }
      }, 1000);
    }
