<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIFE SURVIVAL 3D - 24시간, 나의 자원을 지켜라!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js (3D 시뮬레이션 엔진) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: Jua & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #3a261f;
      --cream: #fff9ef;
      --accent: #ff9f43;
      --mint: #52c498;
      --sky: #70d6ff;
      --coral: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at top left, #fff5e1 0%, #eafaf1 50%, #e0f2fe 100%);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
    }

    .font-game {
      font-family: 'Jua', sans-serif;
      letter-spacing: 0.02em;
    }

    .cozy-card {
      background: #fffdf8;
      border: 3px solid var(--ink);
      border-radius: 1.5rem;
      box-shadow: 0 6px 0 var(--ink);
    }

    .cozy-panel {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 1.15rem;
      box-shadow: 0 4px 0 var(--ink);
    }

    .btn-cozy {
      border: 2.5px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-cozy:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 5px 0 var(--ink);
    }
    .btn-cozy:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 1.5rem;
      overflow: hidden;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 65%, #dcfce7 100%);
      box-shadow: inset 0 0 24px rgba(58, 38, 31, 0.08);
    }

    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .canvas-wrap canvas:active { cursor: grabbing; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: floatSlow 2.6s ease-in-out infinite; }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: popIn 0.25s ease-out both; }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .cozy-card, .cozy-panel { box-shadow: none !important; }
    }
  </style>
</head>
<body class="pb-10">
